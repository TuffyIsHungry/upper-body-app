<style>
#boot{--ba:#FF6A2B;--bon:#0B0E13;--bbg:#06080C;--bs:#1A1F29;--bfg:#F3F5F9;position:fixed;inset:0;z-index:9999;overflow:hidden;background:var(--bbg);box-shadow:0 0 0 100vmax var(--bbg);font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  --ang:-14deg;--t1:.28s}
#boot .h{position:absolute;inset:0;overflow:hidden}
/* the entrance waits at its first frame until the page can really draw it: after a cold start the phone is busy loading
   for a moment, and an animation already "running" then would be mostly over before the first frame shows */
#boot.hold,#boot.hold *,#boot.hold *::before,#boot.hold *::after{animation-play-state:paused!important}
#boot .b-wait{position:absolute;left:50%;top:50%;width:72px;height:3px;margin:-1.5px 0 0 -36px;border-radius:2px;overflow:hidden;z-index:5;background:color-mix(in srgb,var(--bfg) 12%,transparent);opacity:0;transition:opacity .15s}
#boot .b-wait::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:var(--ba);animation:bWait .9s cubic-bezier(.45,0,.55,1) infinite}
#boot.hold > :not(.b-wait){visibility:hidden}#boot.hold .b-wait{opacity:1;transition:opacity .3s .25s}#boot.hold .b-wait::after{animation-play-state:running!important}
@keyframes bWait{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#boot .h.o{clip-path:polygon(0 0,100% 0,100% 44.5%,0 55.5%);background:linear-gradient(160deg,color-mix(in srgb,var(--ba) 62%,#fff) 0%,var(--ba) 45%,color-mix(in srgb,var(--ba) 80%,#000) 100%);color:var(--bon);animation:bTop var(--t1) cubic-bezier(.6,0,.4,1.35) both}
#boot .h.d{clip-path:polygon(0 55.5%,100% 44.5%,100% 100%,0 100%);background:radial-gradient(120% 70% at 50% 100%,var(--bs) 0%,var(--bbg) 62%);color:var(--bfg);animation:bBot var(--t1) cubic-bezier(.6,0,.4,1.35) both}
#boot .h.o::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.07) 0 2px,transparent 2px 26px);animation:bSlide 6s linear infinite}
#boot .h.d::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ba) 24%,transparent),transparent 45%)}
#boot .seam{position:absolute;left:-10%;right:-10%;top:50%;height:3px;margin-top:-1.5px;transform:rotate(var(--ang));background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ba) 25%,#fff) 30%,#fff 50%,color-mix(in srgb,var(--ba) 25%,#fff) 70%,transparent);
  box-shadow:0 0 18px 4px color-mix(in srgb,var(--ba) 80%,transparent);opacity:0;animation:bSeam .7s ease calc(var(--t1) - .02s) both}
#boot .b-stage{position:absolute;inset:-14px;animation:bShake .28s ease calc(var(--t1) + .24s) both}
#boot .b-art{position:absolute;inset:0;display:block}
#boot .b-eb{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 11vh);text-align:center;font-weight:700;font-size:3.6vw;letter-spacing:.6em;padding-left:.6em;text-transform:uppercase;opacity:.7;animation:bFade .3s ease calc(var(--t1) + .22s) both}
#boot .b-up,#boot .b-dn{position:absolute;left:0;right:0;display:flex;justify-content:center;font-weight:900;font-size:25vw;line-height:.86;letter-spacing:-.02em}
#boot .b-up{top:calc(env(safe-area-inset-top,0px) + 16vh)}
#boot .b-dn{top:max(61vh,calc(50% + 31vw))}
#boot .h.d .b-dn span{color:var(--bfg);text-shadow:0 8px 34px color-mix(in srgb,var(--ba) 40%,transparent)}
#boot .b-up span{display:inline-block;animation:bDrop .32s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--t1) + .2s + var(--i) * 22ms)}
#boot .b-dn span{display:inline-block;animation:bRise .32s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--t1) + .2s + var(--i) * 22ms)}
#boot .b-dbw{position:absolute;left:4vw;right:4vw;top:50%;transform:translateY(-50%) rotate(var(--ang))}
#boot .b-db{width:100%;height:auto;display:block;overflow:visible;fill:currentColor;animation:bRep 1.2s ease-in-out calc(var(--t1) + .7s) infinite}
#boot .b-db .bar{transform-box:fill-box;transform-origin:center;animation:bBar .2s cubic-bezier(.3,1.3,.5,1) var(--t1) both}
#boot .b-db .pl{transform-box:fill-box;transform-origin:center}
#boot .b-db .pl.l{animation:bPlL .28s cubic-bezier(.5,0,.3,1.6) calc(var(--t1) + .06s) both}
#boot .b-db .pl.r{animation:bPlR .28s cubic-bezier(.5,0,.3,1.6) calc(var(--t1) + .06s) both}
#boot .h.o .b-db{fill:var(--bon)} #boot .h.d .b-db{fill:var(--bfg);filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--ba) 45%,transparent))}
#boot .b-tg{position:absolute;left:0;right:0;top:84vh;text-align:center;font-size:3.1vw;font-weight:700;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:color-mix(in srgb,var(--bfg) 60%,transparent);animation:bFade .3s ease calc(var(--t1) + .3s) both}
#boot .b-tg b{color:var(--ba)}
#boot .b-tk{position:absolute;left:0;right:0;top:calc(84vh + 7.5vw);height:1.4em;overflow:hidden;font-size:3.4vw;font-weight:600;color:color-mix(in srgb,var(--bfg) 45%,transparent);animation:bFade .3s ease calc(var(--t1) + .36s) both}
#boot .b-tk div{display:flex;flex-direction:column;align-items:center;animation:bTick 2.4s steps(1) calc(var(--t1) + .5s) infinite}
#boot .b-tk span{height:1.4em;line-height:1.4em}
#boot .b-tk span::after{content:"…"}
#boot .h.o .b-tg,#boot .h.o .b-tk{display:none}
#boot .h.d .b-eb{display:none}
#boot .spk{position:absolute;left:50%;top:50%;pointer-events:none}
#boot .spk i{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:color-mix(in srgb,var(--ba) 20%,#fff);box-shadow:0 0 8px 2px var(--ba);opacity:0;animation:bSpk .55s cubic-bezier(.1,.7,.3,1) calc(var(--t1) + .26s + var(--s)) both}
#boot .spk.l{margin-left:-39vw} #boot .spk.r{margin-left:39vw}
#boot .spk.l{transform:translateY(9vw)} #boot .spk.r{transform:translateY(-9vw)}
#boot .flash{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 50%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;animation:bFlash .3s ease calc(var(--t1) + .25s) both}
#boot.gone{pointer-events:none;visibility:hidden;background:transparent;box-shadow:none;transition:visibility 0s .5s;animation:bGone .2s ease .28s forwards}
#boot.gone .h.o{animation:bOutT .45s cubic-bezier(.6,0,.2,1) forwards}
#boot.gone .h.d{animation:bOutB .45s cubic-bezier(.6,0,.2,1) forwards}
#boot.gone .seam{animation:bSeamOut .14s ease forwards} #boot.gone .spk,#boot.gone .flash{display:none}
@keyframes bGone{to{opacity:0}}
#boot.sheen .h.o::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);transform:translateX(-110%);animation:bSheen 1.5s ease .55s infinite}
@keyframes bSheen{0%{transform:translateX(-110%)}60%,100%{transform:translateX(110%)}}
@keyframes bSeamOut{from{opacity:.35}to{opacity:0}}
/* the app behind: slightly zoomed out and dimmed while loading, it settles as the halves open */
html.bootin .app{transform:scale(.94);opacity:0}
html.bootin .tabs{opacity:0;transform:translateY(24px)}
html.booting .app,html.booting .tabs{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s ease}
@keyframes bTop{0%{transform:translateY(-62%)}100%{transform:none}}
@keyframes bBot{0%{transform:translateY(62%)}100%{transform:none}}
@keyframes bOutT{to{transform:translate(-4%,-70%) rotate(-4deg)}}
@keyframes bOutB{to{transform:translate(4%,70%) rotate(-4deg)}}
@keyframes bSeam{0%{opacity:1;transform:rotate(var(--ang)) scaleX(.1)}25%{opacity:1;transform:rotate(var(--ang)) scaleX(1)}100%{opacity:.35;transform:rotate(var(--ang)) scaleX(1)}}
@keyframes bShake{0%,100%{transform:none}20%{transform:translate(-6px,4px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes bBar{from{transform:scaleX(0)}to{transform:none}}
@keyframes bPlL{from{transform:translateX(-260%);opacity:0}to{transform:none;opacity:1}}
@keyframes bPlR{from{transform:translateX(260%);opacity:0}to{transform:none;opacity:1}}
@keyframes bDrop{from{transform:translateY(-110%);opacity:0}to{transform:none;opacity:1}}
@keyframes bRise{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes bFade{from{opacity:0}to{opacity:1}}
@keyframes bRep{0%,100%{transform:none}50%{transform:translateY(-2.5%) scale(1.02)}}
@keyframes bSlide{to{transform:translateX(26px)}}
@keyframes bTick{0%{transform:translateY(0)}33.3%{transform:translateY(-1.4em)}66.6%{transform:translateY(-2.8em)}}
@keyframes bSpk{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
@keyframes bFlash{0%{opacity:0}15%{opacity:.5}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){#boot *,#boot *::before{animation:none!important}#boot .seam{opacity:.35}#boot.gone{opacity:0;transition:opacity .3s}}
@media (min-aspect-ratio: 10/19){#boot .b-dbw{left:14vw;right:14vw}#boot .b-dn{top:max(61vh,calc(50% + 25vw))}#boot .b-tg{top:86vh}#boot .b-tk{top:calc(86vh + 7vw)}}

en plays from the start, instead of being half skipped."]]},{v:"2026-11-23a",d:"23 Nov",items:[["#F0AE2E","Bonus quests stay put","The day's quest is chosen once and stays, even if you move, skip or swap exercises. A quest you already finished today is given when you open the app."],["var(--push)","Extra sets fold like the rest","An exercise with an extra set now folds away once every set is ticked."]]},{v:"2026-11-22m",d:"22 Nov",items:[["var(--good)","Quieter, sturdier saving","The phone's storage was getting full with extra copies, so some saves didn't stick. Those copies moved to the phone's larger storage. Repairs now happen quietly and are listed in Settings \u2192 Your data."],["var(--core)","No more level-up bursts","Opening the app no longer shows a pile of muscle level-ups for things that were simply restored."]]},{v:"2026-11-22k",d:"22 Nov",items:[["var(--core)","Muscle ranks, redone","Your strongest muscle, your average level and how many are Gold or better at a glance, a bar showing your ranks, and one clear row per muscle with its way to the next level."],["var(--push)","A bolder race","This week's race is now big bars with everyone's photo inside: the leader's shines in gold, and the ring around your photo is your progress to the next level."]]},{v:"2026-11-22j",d:"22 Nov",items:[["var(--push)","Swaps always work","A swap you pick for the day is applied every time, also in travel mode and injury mode (injury mode only makes it lighter)."],["var(--core)","A new look for your muscles","The body on Home is lit up like a stage: rounded muscles, a glow on your best ones, and the level of your three strongest right on the body."],["#F0AE2E","Friends, polished","Your card shows your place this week, streak and regularity. Medals in the race, and the table is easier to follow."]]},{v:"2026-11-22i",d:"22 Nov",items:[["var(--push)","A new Friends tab","This week is now a race: everyone's lane, the leader in gold, and how many points you need to pass the next person."],["#F0AE2E","Everything side by side","Level, regularity, streaks, best lifts and every muscle in one table, one column per friend. No more switching: the best of each row is in gold."]]},{v:"2026-11-22h",d:"22 Nov",items:[["var(--core)","Timed holds","Plank, side plank and suitcase hold are timed now: tap Start on a set, hold as long as you can, tap to stop. The goal is a little more than your best last time, and beating your best is a record. Per-side holds switch sides by themselves after 5 s."],["var(--pull)","Stretches too","Stretches get the same timer with a fixed 30 s."],["var(--good)","Backups you can see","Settings \u2192 Your data shows where your data is and every online backup. Open one to see what it has that your phone doesn't, then bring it back in one tap. Backups now happen by themselves, a couple of minutes after you log something."]]},{v:"2026-11-22g",d:"22 Nov",items:[["var(--good)","Your data is safe","The phone is the main copy, saved twice on the phone. Syncing with your account can only add to it: nothing you logged is ever replaced or removed by another copy."],["var(--pull)","Backups you can bring back","A full backup every day on the phone and in your account (14 days kept). Settings \u2192 Your data and backups: check any of them and add back what's missing."]]},{v:"2026-11-22f",d:"22 Nov",items:[["var(--push)","Player cards","This week's top three are dealt as cards, face down, then flipped: the leader lands last, gets the crown and the shine. Tap a card to turn it over for streak, regularity and records."],["var(--pull)","Opens once, smoothly","The Friends tab no longer draws itself twice: it opens with your last board, waits a moment for fresh numbers, then deals the cards once."],["var(--good)","Frame your photo","After choosing a profile photo, drag it and pinch (or use the slider) to frame it in the circle."],["var(--core)","Opening the app","The screen edges now match the loading screen from the very first frame."]]},{v:"2026-11-22e",d:"22 Nov",items:[["var(--push)","A podium every week","The Friends tab opens on this week's podium: the top three stand on stacks of plates, the leader gets the crown."],["var(--pull)","Muscles, head to head","Pick a friend and compare every muscle: their rank, yours, and the score of the match."],["var(--good)","Your photo","Tap your picture in the Friends tab to add a profile photo. Invite now folds away until you need it."]]},{v:"2026-11-22d",d:"22 Nov",items:[["var(--push)","Friends tab, redone","The four boards work even before you add anyone, so you see your own week, regularity, records and muscles. Send your code in one tap; typing a friend's code opens its own small screen."],["var(--pull)","Tab bar fix","After typing on iPhone, the bottom bar could stay lifted above the bottom of the screen. It now snaps back."]]},{v:"2026-11-22c",d:"22 Nov",items:[["var(--push)","Friends tab","Everything about friends now has its own tab: this week's points, regularity, records and muscle levels. Move or hide it in Settings \u2192 Tabs."],["var(--pull)","Your program","Settings \u2192 Your program: change which day you train what, swap exercises, sets and reps, or start from another template. Days you already trained keep their plan."],["var(--good)","Ready for friends","On a new phone, the app asks for a program, training days and body numbers, and works out food targets from them. Rest days never break a streak."]]},{v:"2026-11-22b",d:"22 Nov",items:[["var(--good)","Your account","Settings \u2192 Account: a private online copy of everything, so a new phone gets it all back. Only you can read it."],["var(--push)","Friends and leaderboard","Add friends with a 6-letter code and compare points this week, regularity, records and muscle levels. They never see your sleep, weight or food."]]},{v:"2026-11-22a",d:"22 Nov",items:[["var(--pull)","Easy weeks make sense","Re-entry weeks suggest about 70% of your old weights. Deload and re-entry weeks no longer ask for mor       ${_t()?"":'<p class="small muted"><span class="g-key"></span> Priority muscles. Rear delts get extra indirect work from rows and pull-ups.</p>'}`)}

    ${w("The phases",`<p>${ha()?"The weeks follow a cycle so you start safely, then keep progressing without burning out.":"The weeks follow a cycle so you come back from your break safely, then keep progressing without burning out."}</p>
      <div class="g-tl">${m}</div>
      <div class="g-rows">
        ${ha()?"<div><b>Weeks 1\u20132 \xB7 Easy start.</b> 2 sets per exercise with light weights, 3\u20134 reps short of failure. Learn each movement; tendons and joints need time to get used to training. Easy now means no injuries later.</div>":"<div><b>Weeks 1\u20132 \xB7 Re-entry.</b> 2 sets per exercise at about 70% of your old weights, 3\u20134 reps short of failure. Muscle comes back fast after a break; tendons and joints need longer. Easy now means no injuries later.</div>"}
        <div><b>Weeks 3\u20134 \xB7 Build.</b> All sets, still 2\u20133 reps short of failure. Add weight every week.</div>
        <div><b>Weeks 5\u20138 \xB7 Push.</b> Efforts as written on each exercise. This is where most growth happens.</div>
        <div><b>Week 9 \xB7 Deload.</b> Half the sets, same weights. Fatigue drops, strength shows up.</div>
        <div><b>After that:</b> 6 Push weeks + 1 Deload week, repeating as long as you follow the plan.</div>
      </div>`)}

    ${w("How hard to go: RIR",`<p><b>RIR</b> means <b>reps in reserve</b>: how many more reps you could still have done with good form.</p>
      <ul class="bul" style="--c:var(--pull)">
        <li><b>RIR 2</b>: you stop with 2 good reps left.</li>
        <li><b>RIR 0</b>: you couldn't do one more. That is failure.</li>
        <li>Big lifts (presses, squats, rows) stay at <b>RIR 1\u20132</b>. Failing there is risky and costs a lot of recovery.</li>
        <li>Small isolation work (laterals, curls, flyes) goes to <b>RIR 0\u20131</b>. It's safe and recovers fast.</li>
        <li>Lateral raises: the last set goes to failure, because side delts respond well to it.</li>
      </ul>`)}

    ${w("How you progress",`<p>Every exercise has a rep range, for example <b>8\u201312</b>. The plan uses <b>double progression</b>:</p>
      <ol class="bul g-ol" style="--c:var(--legs)">
        <li>Pick a weight you can lift for the bottom of the range.</li>
        <li>Each session, try to add a rep on some sets.</li>
        <li>Once <b>every set</b> reaches the top of the range, add weight: about 2.5 kg on barbells and machines, 1\u20132 kg on dumbbells and cables.</li>
        <li>You drop back to the bottom of the range and build up again.</li>
      </ol>
      <p class="small muted">The Today tab does this for you: it shows your last numbers and says \u201CTop of range hit\u201D when it's time to add weight.</p>`)}

    ${w("How a session is built",`<ul class="bul" style="--c:var(--push)">
        <li><b>Heaviest lift first</b>, while you're fresh. It gets a warm-up and 2\u20133 min of rest.</li>
        <li><b>Then the secondary lifts</b>, with about 2 min of rest.</li>
        <li><b>Small exercises last</b>, with 60\u201390 s of rest.${me()?"":" Two of them are paired as a superset to save time."}</li>
        <li>The rest timer starts by itself when you tick a set.</li>
      </ul>`)}

    ${w("Busy weeks",`<ul class="bul" style="--c:var(--core)">
        <li><b>Express</b> keeps only the 3 exercises per day that matter most${me()?" (the first three of the day)":" for shoulders, lats and abs"} (about 25 min). Turn on <b>Exam week</b> to use it for a whole week.</li>
        <li>Short on time on a single exercise? <b>Skip it</b>. One missed exercise changes nothing.</li>
        <li>Missed a whole day? Just do today's workout. Don't do two in one day.</li>
        ${me()?"<li><b>Rest days</b> are part of the plan. A walk or some stretching is plenty.</li>":"<li><b>Sunday</b> is core and mobility, 15 minutes, optional. If you're sore or slept badly, skip it.</li>"}
      </ul>`)}

    ${w("Food and sleep",`<ul class="bul" style="--c:var(--legs)">
        <li>About <b>${Jt().kcal} kcal</b> and <b>${Jt().prot} g protein</b> a day.</li>
        <li>${{bulk:"Aim to gain about <b>0.2\u20130.35 kg a week</b>.",keep:"Keep your weekly average within about <b>0.2 kg</b>.",cut:"Aim to lose about <b>0.25\u20130.75 kg a week</b>."}[Jt().goal]} The Progress tab compares your weekly average weight and tells you if you should eat more or less.</li>
        <li><b>${Ut}</b> of sleep. It's when the muscle you trained for actually gets built.</li>
      </ul>`)}

    ${w("When something isn't working",`<ul class="bul" style="--c:var(--warn)">
        <li><b>A lift is stuck for 2\u20133 weeks:</b> check your sleep and your weight trend first. If both are fine, swap the exercise for the alternative shown on its card.</li>
        <li><b>Something hurts</b> (joint pain, not normal muscle burn): swap to the alternative or skip the exercise that day.</li>
        <li><b>Always tired, everything feels heavy:</b> take a deload week early. That's a normal adjustment, not giving up.</li>
      </ul>`)}

<div id="upd" class="upd" hidden role="status"><span>New version ready</span><button type="button" id="updgo">Reload</button><button type="button" id="updx" aria-label="Later">✕</button></div>
<style>.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:60;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--fg,#EEF1F6);color:var(--bg,#0C0F14);font:600 14px var(--body,system-ui);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}
.upd button{height:34px;padding:0 14px;border-radius:999px;border:0;font:700 14px var(--body,system-ui);background:var(--push,#FF6A2B);color:#fff}
.upd #updx{background:transparent;color:inherit;padding:0 10px;opacity:.6}</style>
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // a newer version was downloaded in the background: offer a one-tap reload (saves first)
  navigator.serviceWorker.addEventListener("message", e => {
    if (!e.data || e.data.type !== "update-ready") return;
    const u = document.getElementById("upd"); if (!u) return; u.hidden = false;
    document.getElementById("updgo").onclick = () => { try { dispatchEvent(new Event("pagehide")); } catch (x) {} setTimeout(() => location.reload(), 150); };
    document.getElementById("updx").onclick = () => { u.hidden = true; };
  });
}
</script>
