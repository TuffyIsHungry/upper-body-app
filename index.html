<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aesthetic Upper Body</title>
<meta name="description" content="Training, nutrition and sleep tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Upper Body">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrolling view, fixed bottom tab bar.
   Colour = workout type (push orange, pull blue, legs green, core violet), carried over from the PDF plan. */
:root{
  --bg:#0C0F14; --surface:#151920; --surface-2:#1D222B; --line:#29303B;
  --fg:#EEF1F6; --muted:#8F98A7; --faint:#5D6675;
  --push:#FF6A2B; --pull:#4A90FF; --legs:#35C46D; --core:#A182FF;
  --good:#35C46D; --warn:#F2B13C; --on-c:#FFFFFF;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --fig:#DFE5EE; --fig2:#5D6779; --hair:#9AA4B5; --shorts:#3B4454; --shoe:#AEB7C6; --eqf:#4A5363; --eqpad:#2E3542; --elev:inset 0 1px 0 rgba(255,255,255,.045),0 12px 28px -16px rgba(0,0,0,.75);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --tabh:62px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EBEDF1; --line:#DADEE5;
    --fg:#131720; --muted:#5B6372; --faint:#99A0AC;
    --push:#E5560B; --pull:#1B6FD6; --legs:#22914B; --core:#6C47DE;
    --good:#22914B; --warn:#B3741A; --on-c:#FFFFFF;
    --shadow:0 10px 30px rgba(20,25,35,.14);
    --fig:#2B3241; --fig2:#AEB6C3; --hair:#141820; --shorts:#5E6A80; --shoe:#141820; --eqf:#9BA4B2; --eqpad:#D3D8E0; --elev:0 1px 2px rgba(20,25,35,.05),0 8px 22px -14px rgba(20,25,35,.2);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EBEDF1; --line:#DADEE5;
  --fg:#131720; --muted:#5B6372; --faint:#99A0AC;
  --push:#E5560B; --pull:#1B6FD6; --legs:#22914B; --core:#6C47DE;
  --good:#22914B; --warn:#B3741A; --on-c:#FFFFFF;
  --shadow:0 10px 30px rgba(20,25,35,.14);
  --fig:#2B3241; --fig2:#AEB6C3; --hair:#141820; --shorts:#5E6A80; --shoe:#141820; --eqf:#9BA4B2; --eqpad:#D3D8E0; --elev:0 1px 2px rgba(20,25,35,.05),0 8px 22px -14px rgba(20,25,35,.2);
  color-scheme:light;
}
:root[data-app-theme="light"]{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EBEDF1; --line:#DADEE5;
  --fg:#131720; --muted:#5B6372; --faint:#99A0AC;
  --push:#E5560B; --pull:#1B6FD6; --legs:#22914B; --core:#6C47DE;
  --good:#22914B; --warn:#B3741A; --on-c:#FFFFFF;
  --shadow:0 10px 30px rgba(20,25,35,.14);
  --fig:#2B3241; --fig2:#AEB6C3; --hair:#141820; --shorts:#5E6A80; --shoe:#141820; --eqf:#9BA4B2; --eqpad:#D3D8E0; --elev:0 1px 2px rgba(20,25,35,.05),0 8px 22px -14px rgba(20,25,35,.2);
  color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#0C0F14; --surface:#151920; --surface-2:#1D222B; --line:#29303B;
  --fg:#EEF1F6; --muted:#8F98A7; --faint:#5D6675;
  --push:#FF6A2B; --pull:#4A90FF; --legs:#35C46D; --core:#A182FF;
  --good:#35C46D; --warn:#F2B13C; --on-c:#FFFFFF;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --fig:#DFE5EE; --fig2:#5D6779; --hair:#9AA4B5; --shorts:#3B4454; --shoe:#AEB7C6; --eqf:#4A5363; --eqpad:#2E3542; --elev:inset 0 1px 0 rgba(255,255,255,.045),0 12px 28px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}

@property --glow{syntax:"<color>";inherits:true;initial-value:#4A90FF}
#glow{transition:--glow .9s ease}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 44px);
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pull);outline-offset:2px}
.app{max-width:560px;margin:0 auto;position:relative;z-index:1}
#glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(110% 55% at 100% -8%, color-mix(in srgb, var(--glow) 26%, transparent), transparent 62%),
             radial-gradient(80% 45% at -12% 4%, color-mix(in srgb, var(--glow) 11%, transparent), transparent 60%)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:color-mix(in srgb, var(--bg) 96%, transparent);box-shadow:0 1px 0 color-mix(in srgb, var(--fg) 6%, transparent);margin:0 -16px;padding-left:16px;padding-right:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top .eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn.sync{position:relative}
.sync i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 2px var(--surface)}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="saving"] i{background:var(--warn);animation:blink 1s infinite}
.sync[data-s="local"] i,.sync[data-s="slow"] i,.sync[data-s="error"] i{background:var(--warn)}
@keyframes blink{50%{opacity:.25}}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--elev)}
.icon-btn svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- view + entrance motion ---------- */
.view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.view.in-r{animation:inR .34s cubic-bezier(.2,.8,.2,1) both}
.view.in-l{animation:inL .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{transform:translateX(22px)}to{transform:none}}
@keyframes inL{from{transform:translateX(-22px)}to{transform:none}}
.view.enter > *{animation:rise .46s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--d,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--elev)}
.sec-t{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;margin:0 0 10px;text-wrap:balance}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13.5px;line-height:1.45}
p{margin:0}

/* ---------- day strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;transition:background .2s}
.strip .dl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.strip .dn{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.strip .dot{width:8px;height:8px;border-radius:50%;border:1.6px solid var(--c);opacity:.9}
.strip .dot.full{background:var(--c)}
.strip .dot.half{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.strip button[aria-current="date"]{background:var(--surface)}
.strip button.is-today .dn{color:var(--c)}

/* ---------- workout banner ---------- */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 14px;flex-wrap:wrap;
  background:linear-gradient(150deg, color-mix(in srgb, var(--c) 30%, var(--surface)) 0%, color-mix(in srgb, var(--c) 12%, var(--surface)) 70%);
  display:flex;gap:14px;align-items:center;box-shadow:var(--elev),inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent)}
.bnote{flex-basis:100%;font-size:13.5px;line-height:1.45;color:color-mix(in srgb, var(--fg) 78%, transparent);padding-top:11px;border-top:1px solid color-mix(in srgb, var(--c) 25%, transparent);position:relative;z-index:1}
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbar .linkb{margin-left:auto}
.tchip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:var(--elev);font-size:13.5px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
.tchip .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
.tchip .tick svg{width:11px;height:11px;stroke:var(--on-c);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tchip .tick path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.tchip.on{color:var(--fg);background:color-mix(in srgb, var(--c) 16%, var(--surface))}
.tchip.on .tick{background:var(--c);border-color:var(--c)} .tchip.on .tick path{stroke-dashoffset:0}
.exp-note{padding:0 4px;margin-top:-4px}
.banner::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%);pointer-events:none}
.banner .bt{flex:1;min-width:0}
.banner .lbl{color:var(--c)}
.banner h2{margin:4px 0 2px;font-family:var(--display);font-weight:700;font-size:46px;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.banner .focus{font-weight:600}
.banner .meta{font-size:13px;color:var(--muted);margin-top:6px}
.ring{position:relative;width:86px;height:86px;flex-shrink:0;z-index:1}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring .trk{stroke:color-mix(in srgb, var(--c) 22%, transparent)}
.ring .val{stroke:var(--c);transition:stroke-dashoffset .8s cubic-bezier(.3,.8,.2,1)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rt b{font-family:var(--display);font-size:24px;font-weight:700;display:block}
.ring .rt small{font-size:11px;color:var(--muted)}

.phase{display:flex;gap:12px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;
  background:color-mix(in srgb, var(--c, var(--pull)) 16%, transparent);color:var(--c, var(--pull));white-space:nowrap}

/* ---------- exercise cards ---------- */
.ex{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--elev);transition:box-shadow .4s,opacity .3s}
.ex.all{box-shadow:var(--elev),inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, transparent)}
.ex.cur{box-shadow:var(--elev),inset 0 0 0 1.5px color-mix(in srgb, var(--c) 75%, transparent),0 14px 34px -16px color-mix(in srgb, var(--c) 60%, transparent)}
.upnext{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c);margin-bottom:2px}
.upnext::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.ex.fold{padding:10px 12px;gap:0;background:color-mix(in srgb, var(--surface) 70%, transparent)}
.ex.fold .ex-h{align-items:center}
.ex.fold .thumb{width:56px;height:46px}
.ex.fold .thumb .ex-n{display:none}
.ex.fold h3{font-size:15px}
.ex.fold .donei{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex-shrink:0}
.ex.fold .donei svg{width:16px;height:16px;stroke:var(--on-c);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ex-h{display:flex;gap:11px;align-items:flex-start}
.ex-n{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;
  background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c);transition:background .3s,color .3s}
.ex.all .ex-n{background:var(--c);color:var(--on-c)}
.ex-t{flex:1;min-width:0}
.ex-t h3{margin:0;font-size:16.5px;font-weight:600;line-height:1.25}
.ex-m{font-size:13px;color:var(--muted);margin-top:2px}
.ex-c{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted);white-space:nowrap}
.ss{font-size:11.5px;font-weight:600;color:var(--c);margin-top:4px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center}
.set-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 2px}
.set .sn{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted);text-align:center}
.in{width:100%;min-width:0;height:44px;border-radius:12px;border:1.5px solid transparent;background:var(--surface-2);
  font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;transition:border-color .2s,opacity .2s}
.in::placeholder{color:var(--faint);font-weight:500}
.in:focus{outline:none;border-color:var(--c)}
.set.ok .in{opacity:.85}
.set .chk-txt{grid-column:2 / 4;font-size:15px;color:var(--muted)}
.chk{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:border-color .25s}
.chk::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .38s cubic-bezier(.3,1.5,.5,1)}
.chk svg{position:relative;z-index:1;width:22px;height:22px;stroke:var(--on-c);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chk path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .14s cubic-bezier(.5,0,.2,1)}
.set.ok .chk{border-color:var(--c)}
.set.ok .chk::before{transform:scale(1)}
.set.ok .chk path{stroke-dashoffset:0}
.set:not(.ok) .chk::before{transition-duration:.25s;transition-timing-function:ease-in}
.set:not(.ok) .chk path{transition-delay:0s;transition-duration:.15s}
.set.just .chk{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.78)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.chk .rip{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);pointer-events:none;animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(2.1);opacity:0}}
.chk .spk{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--c);pointer-events:none;opacity:0;
  animation:spk .6s var(--dl,0ms) cubic-bezier(.15,.8,.3,1) forwards}
.chk .spk:nth-child(even){width:3px;height:9px;margin:-4.5px -1.5px;border-radius:2px;background:color-mix(in srgb, var(--c) 60%, var(--on-c))}
@keyframes spk{0%{opacity:1;transform:rotate(var(--a)) translateY(-16px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(var(--r,-36px)) scale(.3)}}
.set{border-radius:14px;position:relative}
.set.just::before{content:"";position:absolute;inset:-3px -6px;border-radius:14px;background:var(--c);opacity:0;animation:rowf .8s ease-out;pointer-events:none}
@keyframes rowf{0%{opacity:.16}100%{opacity:0}}
.set.ok .in{color:var(--c)}
.set.ok .sn{color:var(--c)}
.ex-f{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.hint{color:var(--c);font-weight:600}
details.more{font-size:13.5px}
details.more summary{list-style:none;color:var(--muted);font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.more[open] summary::after{transform:rotate(225deg) translate(-2px,0)}
details.more .mb{padding-top:8px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}

.exlist{display:flex;flex-direction:column;gap:14px}
/* exercise figures */
.thumb{--figbg:color-mix(in srgb, var(--c) 9%, var(--surface-2));position:relative;width:86px;height:72px;flex-shrink:0;border-radius:14px;background:var(--figbg);display:block;transition:transform .2s}
.thumb:active{transform:scale(.95)}
.thumb .ex-n{position:absolute;left:-6px;top:-6px;width:24px;height:24px;border-radius:8px;font-size:14px;box-shadow:0 0 0 3px var(--surface)}
.thumb .play{position:absolute;right:5px;bottom:5px;width:16px;height:16px;border-radius:50%;background:var(--surface);display:grid;place-items:center;opacity:.9}
.thumb .play svg{width:8px;height:8px;fill:var(--muted)}
.fig{width:100%;height:100%;display:block;overflow:visible}
.thumb .fig{overflow:hidden;border-radius:14px}
.fig line{stroke-linecap:round;fill:none}
.fig .b1,.fig .b2,.fig .s1,.fig .s2,.fig .sho,.fig .sh2,.fig .hair{stroke:var(--figbg);stroke-width:.9;stroke-linejoin:round;paint-order:stroke}
.fig .b1{fill:var(--fig)} .fig .b2{fill:var(--fig2)}
.fig .s1{fill:var(--shoe)} .fig .s2{fill:var(--fig2)}
.fig .sho{fill:var(--shorts)} .fig .sh2{fill:color-mix(in srgb, var(--shorts) 70%, var(--figbg))}
.fig .hair{fill:var(--hair)} .fig .ear{fill:color-mix(in srgb, var(--fig) 80%, var(--hair))}
.fig .hl{fill:var(--c);transition:none}
.fig .ab{stroke:var(--fig);opacity:.6}
.fig .trl{fill:none;stroke:var(--c);stroke-width:1.2;stroke-dasharray:.1 3;stroke-linecap:round;opacity:.55}
.fig .shd{fill:var(--fg);opacity:.08}
.fig .eqf{fill:var(--eqf)} .fig .eqs{stroke:var(--eqf)} .fig .eqr{stroke:var(--eqf);opacity:.7}
.fig .eqp{fill:var(--eqpad)} .fig .eqpp{fill:var(--eqpad);stroke:var(--figbg);stroke-width:.8} .fig .eqb{fill:var(--eqpad);opacity:.65}
.fig .eqbar{stroke:var(--eqf)} .fig .eqbarc{fill:var(--eqf)}
.fig .stk{fill:var(--fig2)} .fig .stkt{fill:var(--c)}
.fig .cb{stroke:var(--c);opacity:.8}
.fig .pul{fill:var(--figbg);stroke:var(--eqf);stroke-width:1.5}
.fig .hub{fill:var(--fg)}
.fig .plt{fill:var(--figbg);stroke:var(--c);stroke-width:2.3} .fig .plt2{fill:none;stroke:var(--c);stroke-width:.8;opacity:.55}
.fig .dbw{fill:var(--c)} .fig .dbr{fill:color-mix(in srgb, var(--c) 60%, var(--figbg))} .fig .dbh{stroke:var(--fig2)}
.fig .padc{fill:var(--c)} .fig .padr{fill:var(--eqpad)}
.fig .whl{fill:var(--figbg);stroke:var(--fg);stroke-width:1.8} .fig .spk{stroke:var(--fg);opacity:.6}
.fig .mat{fill:var(--c);opacity:.22}
.fig .gr{stroke:var(--line);stroke-width:1.4}
.fig .dot{fill:var(--c)} .fig .dotg{fill:var(--c);opacity:.25}
.demo-fig{--figbg:color-mix(in srgb, var(--c) 9%, var(--surface-2));width:100%;max-width:360px;aspect-ratio:6/5;margin:0 auto;border-radius:20px;background:var(--figbg);padding:10px 12px 6px}
.demo-meta{display:flex;flex-wrap:wrap;gap:6px}
.how{font-size:15.5px;line-height:1.55}
.ex{position:relative;overflow:hidden}
.ex.shine::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,color-mix(in srgb, var(--c) 30%, transparent) 50%,transparent 70%);
  transform:translateX(-100%);animation:shine .9s ease-out forwards}
@keyframes shine{to{transform:translateX(100%)}}
.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.btn,.chk,.strip button,.tabs button,.icon-btn,.mv,.seg button,.qual button,.meal,.chip,.nights button,.row{transition-property:transform,background,color,border-color,box-shadow,opacity;transition-duration:.2s}
.btn:active,.chk:active,.strip button:active,.icon-btn:active,.mv:active,.seg button:active,.qual button:active,.meal:active,.chip:active,.nights button:active{transform:scale(.95)}
.tabs button:active svg{transform:scale(.88)}
.view.swipe-l{animation:swL .32s cubic-bezier(.2,.8,.2,1) both}
.view.swipe-r{animation:swR .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes swL{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes swR{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
.mode-r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.linkb{color:var(--c, var(--pull));font-weight:600;font-size:14px;padding:8px 10px;border-radius:10px;transition:background .2s}
.linkb:active{background:color-mix(in srgb, var(--c, var(--pull)) 14%, transparent)}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:600;transition:background .25s}
.chip .tick,.meal .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:background .25s,border-color .25s}
.chip .tick svg{width:14px;height:14px;stroke:var(--on-c);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chip .tick path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.chip.on{background:color-mix(in srgb, var(--c) 16%, var(--surface-2))}
.chip.on .tick{background:var(--c);border-color:var(--c)}
.chip.on .tick path{stroke-dashoffset:0}
.ex-a{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:-4px}
.acts{display:flex;gap:2px;margin-left:auto}
.acts .linkb{color:var(--muted);font-size:13.5px}
.ex.skipped{padding:10px 14px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ex.skipped .ex-n{background:var(--surface-2);color:var(--faint)}
.ex.skipped h3{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.ex.skipped .ex-h{align-items:center}
.editl .er{display:grid;grid-template-columns:28px 1fr 42px 42px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:var(--surface)}
.editl .er:first-of-type{border-top:0}
.editl .en{font-weight:600;font-size:15px;line-height:1.25;min-width:0}
.editl .er.sk .en{color:var(--muted);text-decoration:line-through}
.mv{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.mv svg{width:20px;height:20px}
.mv:disabled{opacity:.28;cursor:default}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:700;font-size:16px;
  background:var(--c, var(--pull));color:var(--on-c);transition:transform .15s, filter .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn svg{width:20px;height:20px}
.done-note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--c);font-weight:700}

/* ---------- inline fields ---------- */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field .in{width:120px;flex-shrink:0}
.unit{font-size:14px;color:var(--muted);margin-left:6px}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--elev);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.tile b small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.tile .muted{font-size:12.5px}
.delta-up{color:var(--good)} .delta-dn{color:var(--warn)}

/* streak hero */
.streak{display:flex;align-items:center;gap:16px;background:color-mix(in srgb, var(--push) 14%, var(--surface));border-radius:22px;padding:18px}
.flame{width:58px;height:58px;border-radius:18px;background:var(--push);display:grid;place-items:center;flex-shrink:0}
.flame svg{width:32px;height:32px;stroke:var(--on-c);fill:color-mix(in srgb, var(--on-c) 25%, transparent);stroke-width:1.8}
.streak.live .flame{animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.05)}}
.streak b{font-family:var(--display);font-size:48px;font-weight:700;line-height:.9}
.streak .st{flex:1;min-width:0}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:block;max-width:100%}
.heat i.f{background:var(--c)} .heat i.p{background:color-mix(in srgb, var(--c) 38%, var(--surface-2))}
.heat i.t{box-shadow:inset 0 0 0 1.5px var(--fg)} .heat i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}

/* charts */
.chart{position:relative;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.view.enter .chart .ln{animation:draw 1.1s .15s cubic-bezier(.4,.1,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.chart .ln2{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:3 3}
.chart .ar{fill:url(#none);opacity:.18}
.chart .dt{fill:var(--c);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity .15s}
.chart .fd{fill:var(--c);stroke:var(--surface);stroke-width:2.5;opacity:0;transition:opacity .15s}
.chart.on .xh,.chart.on .fd{opacity:1}
.chart .bar{fill:var(--c);transition:opacity .2s}
.chart .bar.lo{fill:color-mix(in srgb, var(--c) 35%, var(--surface-2))}
.chart.on .bar{opacity:.45} .chart.on .bar.sel{opacity:1}
.view.enter .chart .bar{animation:barup .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .tl{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:4 4;opacity:.6}
.tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:600;line-height:1.3;
  padding:6px 9px;border-radius:9px;white-space:nowrap;opacity:0;transform:translate(-50%,-6px);transition:opacity .15s}
.tip small{display:block;font-weight:500;opacity:.75}
.chart.on .tip{opacity:1}
.empty-c{position:relative}
.empty-c .ghost{opacity:.35;filter:saturate(.2)}
.empty-c .em{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-size:14px;color:var(--muted);font-weight:500}

.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sel{appearance:none;-webkit-appearance:none;width:100%;height:46px;border-radius:12px;border:0;background:var(--surface-2);padding:0 40px 0 14px;font-size:16px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .rk{flex:1;min-width:0}
.row .rv{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap}
.daybar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.status svg{width:15px;height:15px}

/* volume bars */
.vb{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.vb .track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.vb .fill{height:100%;border-radius:6px;background:var(--c);transform-origin:left;transition:width .6s}
.view.enter .vb .fill{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.vb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb .nm.pr{font-weight:600}
.vb .ct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* food */
.macro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.macro div{background:color-mix(in srgb, var(--c) 13%, var(--surface));border-radius:14px;padding:11px 10px;min-width:0}
.macro b{display:block;font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.macro span{font-size:11.5px;color:var(--muted)}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);text-align:left;width:100%;transition:background .25s}
.meal + .meal{margin-top:8px}
.meal .mt{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);width:44px;flex-shrink:0;padding-top:1px}
.meal .mx{flex:1;min-width:0}
.meal .mx b{font-weight:600;display:block}
.meal .mx span{font-size:13px;color:var(--muted)}
.meal .mk{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.meal .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:background .25s,border-color .25s}
.meal .tick svg{width:15px;height:15px;stroke:var(--on-c);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.meal .tick path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.meal.on{background:color-mix(in srgb, var(--c) 16%, var(--surface-2))}
.meal.on .tick{background:var(--c);border-color:var(--c)}
.meal.on .tick path{stroke-dashoffset:0}
.meter{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .6s cubic-bezier(.3,.8,.2,1)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.bul li::marker{color:var(--c, var(--muted))}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:0 6px 6px 0}
table.t td{padding:9px 6px 9px 0;border-top:1px solid var(--line);vertical-align:top}
table.t tr.hl td{color:var(--c);font-weight:600}

/* sleep */
.nights{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.nights::-webkit-scrollbar{display:none}
.nights button{flex-shrink:0;padding:8px 12px;border-radius:12px;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.nights button[aria-pressed="true"]{background:var(--c);color:var(--on-c)}
.nights button i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.big-h{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em}
.big-h small{font-size:26px;color:var(--muted);font-weight:600;margin:0 4px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.times input{height:48px;border-radius:12px;border:1.5px solid transparent;background:var(--surface-2);font-size:20px;font-weight:600;text-align:center;padding:0 8px;width:100%;min-width:0}
.times input:focus{outline:none;border-color:var(--c)}
.qual{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qual button{height:44px;border-radius:12px;background:var(--surface-2);font-weight:700;font-family:var(--display);font-size:19px;color:var(--muted);transition:background .2s,color .2s,transform .2s}
.qual button[aria-pressed="true"]{background:var(--c);color:var(--on-c);transform:translateY(-2px)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;z-index:20;left:max(12px, env(safe-area-inset-left, 0px));right:max(12px, env(safe-area-inset-right, 0px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);max-width:540px;margin:0 auto;padding:0 6px;border-radius:26px;
  background:color-mix(in srgb, var(--surface) 76%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid color-mix(in srgb, var(--fg) 9%, transparent);box-shadow:0 16px 36px -12px rgba(0,0,0,.5)}
.tabs-in{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s}
.tabs button svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08)}
.tabs .ind{position:absolute;top:6px;left:0;width:20%;height:50px;display:flex;justify-content:center;pointer-events:none;
  transition:transform .45s cubic-bezier(.3,1.25,.4,1)}
.tabs .ind i{width:64px;border-radius:18px;background:color-mix(in srgb, var(--glow) 18%, transparent);transition:background .6s}
.tabs button[aria-selected="true"] svg{color:var(--glow)}

/* ---------- rest timer ---------- */
.timer{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 22px);z-index:25;
  transform:translate(-50%,140%);visibility:hidden;pointer-events:none;
  transition:transform .45s cubic-bezier(.3,1.3,.4,1),visibility 0s linear .45s;
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:22px;background:var(--surface-2);box-shadow:var(--shadow);
  width:min(360px, calc(100vw - 32px))}
.timer.show{transform:translate(-50%,0);visibility:visible;pointer-events:auto;transition:transform .45s cubic-bezier(.3,1.3,.4,1),visibility 0s}
.timer .tr{width:44px;height:44px;position:relative;flex-shrink:0}
.timer .tr svg{width:44px;height:44px;transform:rotate(-90deg)}
.timer .tr .trk{stroke:var(--line)} .timer .tr .val{stroke:var(--c)}
.timer .tt{flex:1;min-width:0}
.timer .tt b{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;display:block}
.timer .tt span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{height:40px;padding:0 12px;border-radius:12px;background:var(--surface);font-weight:700;font-size:14px}
.timer.over{background:var(--c);color:var(--on-c);animation:nudge .6s ease 2}
.timer.over .tt span{color:var(--on-c);opacity:.85}
.timer.over button{background:color-mix(in srgb, var(--on-c) 22%, transparent);color:var(--on-c)}
@keyframes nudge{0%,100%{transform:translate(-50%,0)}30%{transform:translate(-50%,-6px)}60%{transform:translate(-50%,2px)}}

/* ---------- toast, sheet, confetti ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 12px);z-index:40;transform:translate(-50%,-160%);
  background:var(--fg);color:var(--bg);font-weight:600;font-size:14.5px;padding:11px 16px;border-radius:14px;box-shadow:var(--shadow);
  transition:transform .45s cubic-bezier(.3,1.3,.4,1);max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;z-index:30;touch-action:none;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;overscroll-behavior:contain;contain:layout paint;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-left, 0px));
  transform:translate3d(0,105%,0);transition:transform .42s cubic-bezier(.22,1,.36,1);max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet.show{transform:translate3d(0,0,0)}
.sheet.dragging{overflow:hidden;will-change:transform}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--faint);opacity:.6;margin:2px auto 6px;flex-shrink:0}
.sheet h2{margin:0;font-family:var(--display);font-size:26px}
.sheet input[type=date]{height:46px;border-radius:12px;border:0;background:var(--surface-2);padding:0 12px;font-size:16px;font-weight:600;width:100%}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

.sheet.full{max-height:92vh;gap:0;padding-top:0}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;background:var(--surface)}
.sheet-h h2{margin:0}
.sgroup{display:flex;flex-direction:column;margin-top:18px}
.sgroup > .lbl{margin:0 0 6px 2px}
.sbox{background:var(--surface-2);border-radius:16px;padding:2px 14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow > span{font-size:15px;font-weight:500;min-width:0}
.srow > span small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:1px}
.srow.stack{flex-direction:column;align-items:stretch;gap:8px}
.srow .seg{flex-shrink:0}
.srow .seg button{padding:7px 10px;font-size:13px}
.sw{position:relative;width:50px;height:30px;border-radius:99px;background:var(--line);flex-shrink:0;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* ================= dates ================= */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const x = parse(s); x.setDate(x.getDate() + n); return ymd(x); };

const diffD = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dow = s => parse(s).getDay();
const fmt = (s, o) => parse(s).toLocaleDateString("en-GB", o);
const fShort = s => fmt(s, { weekday: "short", day: "numeric", month: "short" });
const fDM = s => fmt(s, { day: "numeric", month: "short" });

/* ================= state + storage ================= */
const LS = "aub.v1";
const S = { open: new Set(), docs: {}, tab: "today", sel: today(), weekOff: 0, exSel: null, metric: "w", night: today(), mode: "loading" };
try { const j = JSON.parse(localStorage.getItem(LS) || "{}"); if (j && typeof j === "object") S.docs = j; } catch (e) {}
const stableStr = v => v === undefined ? "u" : JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, q) => (o[q] = x[q], o), {}) : x);

let col = null;
const dirty = new Set(), inflight = new Set(), again = new Set(), timers = {};
const sleep = ms => new Promise(r => setTimeout(r, ms));
function touch(id) {

async function flush(id) {
  if (!col || !S.docs[id]) return;
  if (inflight.has(id)) { again.add(id); return; }
  inflight.add(id); setSync("saving");
  const body = JSON.parse(JSON.stringify(S.docs[id]));
  let ok = true;
  try { await col.doc(id).set(body); }
  catch (e) {
    if (e && e.code === "unavailable") { await sleep(700 + Math.random() * 900); try { await col.doc(id).set(body); } catch (e2) { ok = false; saveFail(e2); } }
    else { ok = false; saveFail(e); }
  }
  inflight.delete(id);
  if (again.has(id)) { again.delete(id); flush(id); return; }
  if (ok) dirty.delete(id);
  if (!inflight.size && ok) setSync(S.mode === "cloud" ? "ok" : "local");

function saveFail(e) {
  const c = e && e.code;

  else setSync("error", "Not saved yet");
}
function setSync(s, label) {

  const L = { loading: "Loading", ok: "Synced", saving: "Saving", local: "This phone", slow: "Offline?", error: "Retrying" };
  el.querySelector("span").textContent = label || L[s] || s;
}
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") { S.mode = "local"; setSync("local"); return; }
  let user = null, db = null;
  try { [user, db] = await Promise.all([c.use("user"), c.use("db")]); } catch (e) {}
  const uid = user ? await user.id() : null;
  if (!db || !uid) { S.mode = "local"; setSync("local"); return; }
  try { col = db.collection("data/users/" + uid); } catch (e) { S.mode = "local"; setSync("local"); return; }
  let first = true;
  const slow = setTimeout(() => { if (first) setSync("slow"); }, 10000);
  col.onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) {
      if (dirty.has(d.id)) continue;
      const v = d.data(); if (!v) continue;
      if (stableStr(S.docs[d.id]) !== stableStr(v)) { S.docs[d.id] = JSON.parse(JSON.stringify(v)); changed = true; }
    }
    if (first && !snap.metadata.fromCache) {
      first = false; clearTimeout(slow); S.mode = "cloud"; setSync("ok");
      const have = new Set(snap.docs.map(d => d.id));
      for (const id of Object.keys(S.docs)) if (!have.has(id)) dirty.add(id);
      for (const id of [...dirty]) flush(id);
    }
    if (changed) { saveLocal(); applySettings(); softRender(); }
  }, err => { clearTimeout(slow); col = null; S.mode = "local"; setSync("local"); });
}

/* ================= settings ================= */
const DEFSET = { theme: "auto", palette: "classic", custom: "#FF6A2B", motion: "system",

function lineChart(id, pts, o = {}) {

  const d0 = pts[0].date, span = Math.max(1, diffD(d0, pts[pts.length - 1].date));
  const X = d => pts.length === 1 ? (L + VW - R) / 2 : L + (VW - L - R) * diffD(d0, d) / span;
  const Y = v => T + (VH - T - B) * (1 - (v - lo) / (hi - lo || 1));
  const P = pts.map(p => ({ ...p, px: X(p.date), py: Y(p.y) }));

  const xl = pts.length > 2 ? [P[0], P[Math.floor(P.length / 2)], P[P.length - 1]] : P;
  [...new Set(xl)].forEach((p, i, a) => { g += `<text class="ax" x="${p.px}" y="${VH - 7}" text-anchor="${a.length > 1 && i === 0 ? "start" : a.length > 1 && i === a.length - 1 ? "end" : "middle"}">${fDM(p.date)}</text>`; });
  const line = P.map((p, i) => `${i ? "L" : "M"}${p.px.toFixed(1)},${p.py.toFixed(1)}`).join("");
  const area = P.length > 1 ? `<path d="${line}L${P[P.length - 1].px.toFixed(1)},${VH - B}L${P[0].px.toFixed(1)},${VH - B}Z" fill="var(--c)" opacity=".13"/>` : "";

  return `<div class="chart" data-chart="${id}" style="--c:${o.c || "var(--pull)"}"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${o.label || "Chart"}">${g}${area}${l2}

    <line class="xh" x1="0" x2="0" y1="${T}" y2="${VH - B}"/><circle class="fd" r="6" cx="0" cy="0"/></svg><div class="tip"></div></div>`;
}
function niceTicks(min, max, n = 4) {

function bedFor(w) { const [h, m] = w.split(":").map(Number); let t = h * 60 + m - 450 - 15; t = ((t % 1440) + 1440) % 1440; return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; }

/* ================= chart tooltips ================= */
function chartAt(el, clientX) {
  const id = el.dataset.chart, c = CH[id]; if (!c) return;
  const r = el.querySelector("svg").getBoundingClientRect(), vx = (clientX - r.left) / r.width * c.VW;
  let best = null, bd = 1e9; for (const p of c.pts) { if (p.y == null) continue; const dd = Math.abs(p.px - vx); if (dd < bd) { bd = dd; best = p; } }
  if (!best) return;
  el.classList.add("on");
  const tip = el.querySelector(".tip"), sc = r.width / c.VW;
  if (best.bar) {
    el.querySelectorAll(".bar").forEach(b => b.classList.toggle("sel", +b.dataset.i === c.pts.indexOf(best)));
    tip.innerHTML = `${fH(best.y)}<small>${fShort(best.date)}${best.q ? " · rested " + best.q + "/5" : ""}</small>`;
  } else {
    const xh = el.querySelector(".xh"), fd = el.querySelector(".fd");
    xh.setAttribute("x1", best.px); xh.setAttribute("x2", best.px); fd.setAttribute("cx", best.px); fd.setAttribute("cy", best.py);
    const s = best.s;
    if (id === "bw") tip.innerHTML = `${kg(best.y)} kg<small>${fShort(best.date)}</small>`;
    if (id === "ex") {
      const exo = allExercises().find(e => e.id === S.exSel);
      tip.innerHTML = exo && exo.bw ? `${best.y} reps<small>${fShort(best.date)}</small>` :
        `${S.metric === "e" ? kg(best.y) + " kg est. max" : kg(best.y) + " kg"}<small>${s ? `best ${kg(s.top.w)} × ${s.top.r} · ` : ""}${fShort(best.date)}</small>`;
    }
  }
  const tx = Math.max(60, Math.min(r.width - 60, best.px * sc));

}

/* ================= rest timer ================= */
let T = null, tIv = null, actx = null;
function startTimer(sec, label, color) {
  const st = SET(); if (!sec || !st.rest.auto) return;
  sec = Math.max(15, sec + (st.rest.adj || 0));
  T = { end: Date.now() + sec * 1000, total: sec, label, lastS: null };
  const el = $("#timer"); el.style.setProperty("--c", color); el.classList.remove("over"); el.classList.add("show");
  $("#tlab").textContent = "Rest · " + label;
  clearInterval(tIv); tIv = setInterval(tick, 200); tick();
}
function tick() {
  if (!T) return;
  const left = Math.max(0, T.end - Date.now()), s = Math.ceil(left / 1000);
  if (s !== T.lastS) { if (s >= 1 && s <= 3 && T.lastS != null) SND.count(); T.lastS = s; }
  $("#ttime").textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
  $("#tval").style.strokeDashoffset = (113.1 * (1 - left / (T.total * 1000))).toFixed(1);
  if (left <= 0) {
    clearInterval(tIv); const el = $("#timer"); el.classList.add("over"); $("#ttime").textContent = "Go";
    $("#tlab").textContent = "Rest over · next set"; SND.timer();
    T = null; setTimeout(() => { if (!T) el.classList.remove("show", "over"); }, 5000);
  }
}
function beep() {
  try {
    if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5); o.start(); o.stop(actx.currentTime + 0.55);
  } catch (e) {}
}

/* ================= confetti + toast ================= */
function confetti() {
  if (REDUCED) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), cols = ["--push", "--pull", "--legs", "--core", "--warn"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.32, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = t => {
    const el = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += 0.38; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 2200); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (el < 2200) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(step);
}
let toastT, UNDO = null;

  if (on) toast("Exercise skipped", () => setSkip(i, false));
  if (on) checkAutoDone(d);
}
function setDayMode(v) {
  const d = S.sel, doc = ensureDay(d);
  if (isExpress(d) === (v === "express")) return;
  doc.mode = v; delete doc.order; touch("d" + d);
  const y = scrollY; render(false); scrollTo(0, y); animList();
  checkAutoDone(d);
}
function toggleExpWeek() {
  const mon = mondayOf(S.sel), w = new Set(expWeeks()), on = !w.has(mon);
  on ? w.add(mon) : w.delete(mon);
  S.docs.settings = { ...(S.docs.settings || {}), expressWeeks: [...w].sort().slice(-30) }; touch("settings");
  for (let j = 0; j < 7; j++) { const x = dayDoc(addD(mon, j)); if (x && (x.mode || x.order)) { delete x.mode; delete x.order; touch("d" + x.date); } }
  toast(on ? "Exam week: Express every day this week" : "Back to full workouts this week");
  const y = scrollY; render(false); scrollTo(0, y); animList();
}
function animList() {
  if (REDUCED) return;
  view.querySelectorAll("#exlist > *").forEach((el, j) => el.animate && el.animate([{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: j * 45, easing: "cubic-bezier(.2,.75,.2,1)", fill: "backwards" }));
}
function burst(btn) {
  if (REDUCED) return;
  btn.querySelectorAll(".rip,.spk").forEach(e => e.remove());
  const r = document.createElement("span"); r.className = "rip"; btn.appendChild(r);
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("span"); s.className = "spk";
    s.style.setProperty("--a", (i * 36 + Math.random() * 14 - 7).toFixed(0) + "deg");
    s.style.setProperty("--r", (-30 - Math.random() * 12).toFixed(0) + "px");
    s.style.setProperty("--dl", (40 + Math.random() * 60).toFixed(0) + "ms");
    btn.appendChild(s);
  }
  setTimeout(() => btn.querySelectorAll(".rip,.spk").forEach(e => e.remove()), 900);
}
function summary(d) {
  const doc = dayDoc(d), wk = wkOf(d), c = counts(d), col = TYPES[wk.type], st = streaks();
  let vol = 0, prs = 0;
  for (const k in (doc && doc.ex) || {}) for (const x of doc.ex[k] || []) if (x && x.ok) { if (x.w > 0 && x.r > 0) vol += x.w * x.r; if (x.pr) prs++; }
  const m = sessionMin(doc), next = wkOf(addD(d, 1));
  const sh = $("#sheet"); sh.classList.remove("full"); sh.style.setProperty("--c", col);
  sh.innerHTML = `<div class="grab"></div>
    <div class="sum-h"><span class="lbl" style="color:var(--c)">${wk.name} · ${fShort(d)}</span><h2>${wk.light ? "Session" : "Workout"} complete</h2></div>
    <div class="tiles">
      <div class="tile"><span class="lbl">Time</span><b class="num">${m != null ? `<span data-count="${m}">${m}</span><small>min</small>` : "–"}</b></div>
      <div class="tile"><span class="lbl">Sets</span><b class="num"><span data-count="${c.ok}">${c.ok}</span><small>/ ${c.tot}</small></b></div>
      <div class="tile"><span class="lbl">Volume</span><b class="num">${vol ? `<span data-count="${Math.round(vol)}">${Math.round(vol)}</span><small>kg</small>` : "–"}</b><span class="muted">weight × reps</span></div>
      <div class="tile"><span class="lbl">Records</span><b class="num"><span data-count="${prs}">${prs}</span></b><span class="muted">${prs ? "new personal bests" : "next time"}</span></div></div>
    <div class="card" style="background:var(--surface-2);display:flex;gap:12px;align-items:center"><div class="flame" style="width:44px;height:44px;border-radius:14px">${IC.flame}</div><p class="small"><b>${st.cur}-day streak.</b> Next up: <b>${next.name}</b> (${next.focus.toLowerCase()}). Eat a proper breakfast with protein in the next 1–2 hours.</p></div>
    <button class="btn" data-act="close">Nice</button>`;
  showSheet();
  if (!REDUCED) sh.querySelectorAll("[data-count]").forEach(el => { const end = +el.dataset.count, t0 = performance.now(); const stp = t => { const q = Math.min(1, (t - t0) / 900); el.textContent = Math.round(end * (1 - Math.pow(1 - q, 3))); if (q < 1) requestAnimationFrame(stp); }; requestAnimationFrame(stp); });
}
function celebrate() {
  const dd = ensureDay(S.sel); if (!dd.end && dd.start) { dd.end = Date.now(); touch("d" + S.sel); }
  setTimeout(() => summary(S.sel), REDUCED ? 0 : 1100);
  T = null; clearInterval(tIv); $("#timer").classList.remove("show", "over");
  if (SET().ui.confetti) confetti(); SND.done(); const s = streaks();
  toast(s.cur > 1 ? `Workout done. ${s.cur}-day streak` : "Workout done. Streak started");
}
function toggleFinish() {
  const d = S.sel, doc = ensureDay(d);
  doc.done = !doc.done; touch("d" + d);
  if (doc.done) celebrate();
  refreshToday();
}
function toggleFood(a, b) {
  const t = today(), doc = ensureDay(t); doc.food = doc.food || {};
  if (a === "meal") { const m = doc.food.meals || []; const v = b.dataset.v; doc.food.meals = m.includes(v) ? m.filter(x => x !== v) : [...m, v]; }
  else doc.food[b.dataset.v] = !doc.food[b.dataset.v];
  touch("d" + t);
  const y = scrollY; render(false); scrollTo(0, y);
}
view.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.note) { const nt = { ...notes() }; const v = el.value.trim(); if (v) nt[el.dataset.note] = v; else delete nt[el.dataset.note]; S.docs.notes = nt; touch("notes"); return; }
  if (el.dataset.f === "w" || el.dataset.f === "r") {
    const row = el.closest(".set"); if (!row) return;
    const doc = ensureDay(S.sel), k = row.dataset.ex, i = +row.dataset.i, arr = doc.ex[k] || (doc.ex[k] = []);
    while (arr.length <= i) arr.push(null);
    const st = arr[i] || (arr[i] = {}); st[el.dataset.f] = num(el.value); touch("d" + S.sel);
    if (el.dataset.f === "w") { const pl = document.getElementById("pl-" + k), wk2 = wkOf(S.sel), it2 = plan(S.sel).find(x => x.k === k); if (pl && it2) { const W = workWeight(S.sel, it2); pl.innerHTML = W ? plateText(W) + ` <span class="muted">· ${pl.dataset.note}</span>` : `<span class="muted">Type a weight to see the plates per side</span>`; } }
  } else if (el.dataset.f === "bw") {
    const doc = ensureDay(S.sel); doc.bw = num(el.value); touch("d" + S.sel);
  }
});
view.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "exsel") { S.exSel = el.value; softRenderAnim(); }
  else if (el.dataset.f === "bed" || el.dataset.f === "wake") {
    const doc = ensureDay(S.night); doc.sleep = { ...(doc.sleep || { bed: "22:00", wake: "05:30" }), [el.dataset.f]: el.value };
    if (!doc.sleep.bed) doc.sleep.bed = $("#bed").value; if (!doc.sleep.wake) doc.sleep.wake = $("#wake").value;
    touch("d" + S.night); render(false);
  } else if (el.id === "calcwake" && el.value) {
    $("#calcout").textContent = bedFor(el.value);
    S.docs.settings = { ...(S.docs.settings || {}), wake: el.value }; touch("settings");
  }
});
$("#sheet").addEventListener("input", e => {
  if (e.target.id === "vol") { const st = JSON.parse(JSON.stringify(S.docs.settings || {})); st.snd = { ...(st.snd || {}), vol: +e.target.value }; S.docs.settings = st; touch("settings"); }
  if (e.target.id === "custom") { const st = JSON.parse(JSON.stringify(S.docs.settings || {})); st.custom = e.target.value; st.palette = "custom"; S.docs.settings = st; applySettings(); }
});
$("#sheet").addEventListener("change", e => {
  if (e.target.id === "vol") { SND.unlock(); SND.timer(true); return; }
  if (e.target.id === "custom") { touch("settings"); openSheet(); render(false); return; }
  if (e.target.id === "start" && e.target.value) {
    S.docs.settings = { ...(S.docs.settings || {}), start: e.target.value }; touch("settings");
    toast(`Week 1 now starts ${fShort(mondayOf(e.target.value))}`); render(false);
  }
});

setInterval(() => { if (S.tab === "today" && !document.hidden) { const d0 = dayDoc(S.sel); if (d0 && d0.start && !d0.done) { const bm = $("#bmeta"); if (bm) bm.textContent = bannerMeta(S.sel); } } }, 20000);

view.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.note && e.key === "Enter") { e.preventDefault(); S.noteEdit = null; flipList(); } });

/* swipe left/right on Today to change day */
let sw = null;
view.addEventListener("touchstart", e => {
  if (S.tab !== "today" || S.edit || !SET().ui.swipe || e.touches.length !== 1 || e.target.closest("input,select,.chart,.nights")) { sw = null; return; }
  sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
view.addEventListener("touchend", e => {
  if (!sw) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y; const quick = Date.now() - sw.t < 600; sw = null;
  if (!quick || Math.abs(dx) < 70 || Math.abs(dy) > 45) return;
  S.sel = addD(S.sel, dx < 0 ? 1 : -1);
  render(false); view.classList.add(dx < 0 ? "swipe-l" : "swipe-r");
}, { passive: true });

/* remember where you were, so a restart by iOS doesn't throw you back to the top */
const UIK = "aub.ui";
function saveUI() {
  try { localStorage.setItem(UIK, JSON.stringify({ tab: S.tab, sel: S.sel, y: Math.round(scrollY), t: Date.now(), day: today(),
    timer: T ? { end: T.end, total: T.total, label: T.label, c: $("#timer").style.getPropertyValue("--c") } : null })); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.hidden) saveUI(); });
addEventListener("pagehide", saveUI);
let suT = 0; addEventListener("scroll", () => { clearTimeout(suT); suT = setTimeout(saveUI, 500); }, { passive: true });
let UI0 = null; try { UI0 = JSON.parse(localStorage.getItem(UIK) || "null"); } catch (e) {}
if (UI0 && Date.now() - UI0.t > 45 * 60000) UI0 = null;

/* ================= boot ================= */
const h0 = location.hash.slice(1);
if (TABS.includes(h0)) S.tab = h0; else if (UI0 && TABS.includes(UI0.tab)) S.tab = UI0.tab;
if (UI0 && UI0.day === today() && UI0.sel) S.sel = UI0.sel;
applySettings();
MQ.addEventListener && MQ.addEventListener("change", () => { applyMotion(); render(false); });
render(true);
if (UI0 && UI0.y && (TABS.includes(h0) ? h0 === UI0.tab : true)) requestAnimationFrame(() => scrollTo(0, UI0.y));
if (UI0 && UI0.timer && UI0.timer.end > Date.now() + 1000) {
  const tm = UI0.timer; T = { end: tm.end, total: tm.total, label: tm.label, lastS: null };
  const el = $("#timer"); el.style.setProperty("--c", tm.c || "var(--pull)"); el.classList.add("show");
  $("#tlab").textContent = "Rest · " + tm.label; clearInterval(tIv); tIv = setInterval(tick, 200); tick();
}
connect();
// keep "today" fresh if the app stays open overnight
let lastDay = today();
document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { if (S.sel === lastDay) S.sel = today(); if (S.night === lastDay) S.night = today(); lastDay = today(); render(false); } });
})();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
