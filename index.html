#boot{--ba:#FF6A2B;--bon:#0B0E13;--bbg:#06080C;--bs:#1A1F29;--bfg:#F3F5F9;position:fixed;inset:0;z-index:9999;overflow:hidden;background:var(--bbg);font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  --ang:-14deg;--t1:.28s}

#boot .h.d{clip-path:polygon(0 55.5%,100% 44.5%,100% 100%,0 100%);background:radial-gradient(120% 70% at 50% 100%,var(--bs) 0%,var(--bbg) 62%);color:var(--bfg);animation:bBot var(--t1) cubic-bezier(.6,0,.4,1.35) both}
#boot .h.o::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.07) 0 2px,transparent 2px 26px);animation:bSlide 6s linear infinite}
#boot .h.d::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ba) 24%,transparent),transparent 45%)}
#boot .seam{position:absolute;left:-10%;right:-10%;top:50%;height:3px;margin-top:-1.5px;transform:rotate(var(--ang));background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ba) 25%,#fff) 30%,#fff 50%,color-mix(in srgb,var(--ba) 25%,#fff) 70%,transparent);

#boot .b-up{top:calc(env(safe-area-inset-top,0px) + 16vh)}

#boot .b-tg{position:absolute;left:0;right:0;top:84vh;text-align:center;font-size:3.1vw;font-weight:700;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:color-mix(in srgb,var(--bfg) 60%,transparent);animation:bFade .3s ease calc(var(--t1) + .3s) both}

#boot .h.o .b-tg,#boot .h.o .b-tk{display:none}

#boot .spk{position:absolute;left:50%;top:50%;pointer-events:none}

#boot .spk.l{margin-left:-39vw} #boot .spk.r{margin-left:39vw}
#boot .spk.l{transform:translateY(9vw)} #boot .spk.r{transform:translateY(-9vw)}
#boot .flash{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 50%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;animation:bFlash .3s ease calc(var(--t1) + .25s) both}
#boot.gone{pointer-events:none;visibility:hidden;background:transparent;transition:visibility 0s .5s;animation:bGone .2s ease .28s forwards}
#boot.gone .h.o{animation:bOutT .45s cubic-bezier(.6,0,.2,1) forwards}

@keyframes bGone{to{opacity:0}}
@keyframes bSeamOut{from{opacity:.35}to{opacity:0}}
/* the app behind: slightly zoomed out and dimmed while loading, it settles as the halves open */
html.bootin .app{transform:scale(.94);opacity:.4}
html.bootin .tabs{opacity:0;transform:translateY(24px)}
html.booting .app,html.booting .tabs{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s ease}
@keyframes bTop{0%{transform:translateY(-62%)}100%{transform:none}}
@keyframes bBot{0%{transform:translateY(62%)}100%{transform:none}}
@keyframes bOutT{to{transform:translate(-4%,-70%) rotate(-4deg)}}
@keyframes bOutB{to{transform:translate(4%,70%) rotate(-4deg)}}
@keyframes bSeam{0%{opacity:1;transform:rotate(var(--ang)) scaleX(.1)}25%{opacity:1;transform:rotate(var(--ang)) scaleX(1)}100%{opacity:.35;transform:rotate(var(--ang)) scaleX(1)}}
@keyframes bShake{0%,100%{transform:none}20%{transform:translate(-6px,4px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes bBar{from{transform:scaleX(0)}to{transform:none}}
@keyframes bPlL{from{transform:translateX(-260%);opacity:0}to{transform:none;opacity:1}}
@keyframes bPlR{from{transform:translateX(260%);opacity:0}to{transform:none;opacity:1}}
@keyframes bDrop{from{transform:translateY(-110%);opacity:0}to{transform:none;opacity:1}}
@keyframes bRise{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes bFade{from{opacity:0}to{opacity:1}}
@keyframes bRep{0%,100%{transform:none}50%{transform:translateY(-2.5%) scale(1.02)}}
@keyframes bSlide{to{transform:translateX(26px)}}
@keyframes bTick{0%{transform:translateY(0)}33.3%{transform:translateY(-1.4em)}66.6%{transform:translateY(-2.8em)}}
@keyframes bSpk{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
@keyframes bFlash{0%{opacity:0}15%{opacity:.5}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){#boot *,#boot *::before{animation:none!important}#boot .seam{opacity:.35}#boot.gone{opacity:0;transition:opacity .3s}}

<style>
/* Layout: one-column phone app. Sticky header, scrolling view, fixed bottom tab bar.
   Colour = workout type (push orange, pull blue, legs green, core violet), carried over from the PDF plan. */
:root{
  --bg:#0C0F14; --surface:#151920; --surface-2:#1D222B; --line:#29303B;
  --fg:#EEF1F6; --muted:#8F98A7; --faint:#5D6675;
  --push:#FF6A2B; --pull:#4A90FF; --legs:#35C46D; --core:#A182FF;
  --good:#35C46D; --warn:#F2B13C; --on-c:#FFFFFF;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --fig:#DFE5EE; --fig2:#5D6779; --hair:#9AA4B5; --shorts:#3B4454; --shoe:#AEB7C6; --eqf:#4A5363; --eqpad:#2E3542; --elev:inset 0 1px 0 rgba(255,255,255,.045),0 12px 28px -16px rgba(0,0,0,.75);

}

    color-scheme:light;
  }
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  transition:background-color .45s ease;
  color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.45;

  padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 44px);
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pull);outline-offset:2px}
.app{max-width:560px;margin:0 auto;position:relative;z-index:1}
#glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(110% 55% at 100% -8%, color-mix(in srgb, var(--glow) 26%, transparent), transparent 62%),
             radial-gradient(80% 45% at -12% 4%, color-mix(in srgb, var(--glow) 11%, transparent), transparent 60%)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--bg);box-shadow:0 1px 0 color-mix(in srgb, var(--fg) 6%, transparent);margin:0 -16px;padding-left:16px;padding-right:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top .eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* workout timer: header pill (jumps to the timer row on Today) */
.stw{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 11px 0 10px;border-radius:14px;background:var(--surface);box-shadow:var(--elev),var(--hair);color:var(--fg);font-size:16px;transition:transform .15s}
.stw:active{transform:scale(.94)}
.stw b{font-weight:700;font-size:15px;text-align:left;font-variant-numeric:tabular-nums}
.stw-d{width:8px;height:8px;border-radius:50%;background:var(--good);flex-shrink:0}
.stw[data-s="run"] .stw-d{animation:stwP 1.6s ease-in-out infinite}
.stw[data-s="pause"] .stw-d,.stw[data-s="idle"] .stw-d{background:var(--warn)}
.stw[data-s="pause"] b,.stw[data-s="idle"] b{color:var(--muted)}
.stw[data-s="fin"]{background:color-mix(in srgb, var(--good) 16%, var(--surface))}
.stw[data-s="fin"] .stw-d{display:none}
.stw[data-s="fin"] b{color:color-mix(in srgb, var(--good) 70%, var(--fg))}
.top:has(.stw:not([hidden])) h1{font-size:28px}
@media (max-width:380px){.top:has(.stw:not([hidden])) h1{font-size:25px}}
@keyframes stwP{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent)}50%{box-shadow:0 0 0 5px transparent}}
.stw-i{display:grid;place-items:center;width:18px;height:18px;color:var(--good)}
.stw-i svg{width:18px;height:18px;stroke-width:2.2}
.stw[data-s="pause"] .stw-i,.stw[data-s="idle"] .stw-i{color:var(--warn)}
.stw[data-s="run"] .stw-i svg{animation:stwT 2s ease-in-out infinite;transform-origin:50% 55%}
@keyframes stwT{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(9deg)}30%{transform:rotate(0)}}
.stw{transition:transform .15s,opacity .25s}
.stw.dim{opacity:0;pointer-events:none}
/* timer row in the Today banner */
.tmr{flex-basis:100%;min-width:0;max-width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px 11px 12px;border-radius:16px;background:color-mix(in srgb, var(--bg) 42%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);position:relative;z-index:1}
.tmr-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good)}
.tmr-i svg{width:22px;height:22px;stroke-width:2.2}
.tmr[data-s="none"] .tmr-i,.tmr[data-s="hint"] .tmr-i{background:color-mix(in srgb, var(--fg) 8%, transparent);color:var(--muted)}
.tmr[data-s="pause"] .tmr-i,.tmr[data-s="idle"] .tmr-i{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.tmr[data-s="run"] .tmr-i svg{animation:stwT 2s ease-in-out infinite;transform-origin:50% 55%}
.tmr-m{flex:1;min-width:0}
.tmr-top{display:flex;align-items:baseline;gap:9px;min-width:0}
.tmr-top b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;letter-spacing:.01em}
.tmr[data-s="none"] .tmr-top b,.tmr[data-s="pause"] .tmr-top b,.tmr[data-s="idle"] .tmr-top b{color:var(--muted)}
.tmr-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr[data-s="pause"] .tmr-l,.tmr[data-s="idle"] .tmr-l{color:var(--warn)}
.tmr-sub{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr-sub b{color:var(--fg);font-weight:600}
.tmr-bar{height:5px;border-radius:3px;background:color-mix(in srgb, var(--fg) 10%, transparent);margin-top:7px;overflow:hidden}
.tmr-bar i{display:block;height:100%;border-radius:3px;background:var(--good);transition:width .9s linear}
.tmr-bar.over i{background:var(--warn)}
.tmr-c{font-weight:600}
.tmr-c.good{color:var(--good)} .tmr-c.slow{color:var(--warn)}
.tile .tmr-c{font-size:12.5px}
.tmr-b{display:flex;gap:6px;flex-shrink:0}
.tmr-btn{min-width:44px;height:44px;padding:0 10px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--fg);box-shadow:var(--elev);font-weight:700;font-size:14px;transition:transform .15s}
.tmr-btn:active{transform:scale(.92)}
.tmr-btn svg{width:20px;height:20px}
.tmr-btn.go{background:var(--good);color:#fff}
.tmr-btn.warn{background:color-mix(in srgb, var(--bad, #FF5F57) 20%, var(--surface));color:var(--bad, #FF5F57)}
.tmr.flash{animation:tmrF 1s ease}
.tmr[data-s="none"]{padding:8px;gap:10px}
.tmr-go{flex:1;min-width:0;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--good);color:#fff;font-weight:700;font-size:17px;box-shadow:0 8px 20px -10px color-mix(in srgb, var(--good) 80%, transparent);transition:transform .15s}
.tmr-go:active{transform:scale(.97)}
.tmr-go svg.i{width:20px;height:20px;fill:currentColor}
.tmr-last{display:flex;flex-direction:column;align-items:flex-end;padding-right:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.tmr-last b{font-size:18px;letter-spacing:0;color:var(--fg);text-transform:none}
.home-btn svg.i{width:18px;height:18px;fill:currentColor;margin-right:8px;vertical-align:-3px}
@keyframes tmrF{0%,100%{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent)}30%{box-shadow:inset 0 0 0 2px var(--good),0 0 0 6px color-mix(in srgb, var(--good) 25%, transparent)}}
/* Progress: workout times */
.wt-r{display:grid;grid-template-columns:minmax(0,1fr) 58px auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wt-r:first-of-type{border-top:0}
.wt-n{display:flex;flex-direction:column;min-width:0}
.wt-n b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-bars{display:flex;align-items:flex-end;gap:3px;height:28px}
.wt-bars i{flex:1;border-radius:2px;background:color-mix(in srgb, var(--c) 35%, transparent)}
.wt-bars i.on{background:var(--c)}
.wt-v{display:flex;flex-direction:column;align-items:flex-end;min-width:66px}
.wt-v b{font-size:16px}
.wt-v .tmr-c{font-size:12.5px}
/* level up */
.tour{position:fixed;inset:0;z-index:380;display:grid;place-items:center;padding:24px;background:rgba(4,6,10,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:lvIn .3s ease both}
.tour.out{animation:lvOut .3s ease both}
.tour-card{width:min(340px, 100%);background:var(--surface);border-radius:26px;padding:24px 22px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 0 0 1px var(--line);text-align:center;position:relative;animation:tourIn .35s cubic-bezier(.3,1.3,.5,1) both}
@keyframes tourIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.tour-i{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 12px;background:color-mix(in srgb, var(--c) 20%, var(--surface-2));color:var(--c)}
.tour-i svg{width:32px;height:32px;stroke-width:2}
.tour-n{position:absolute;top:16px;right:18px;font-size:12px;color:var(--muted);font-weight:600}
.tour-card h2{margin:0 0 8px;font-family:var(--display);font-size:26px;line-height:1.05}
.tour-card p{margin:0;font-size:15px;line-height:1.5;color:color-mix(in srgb, var(--fg) 82%, transparent)}
.tour-dots{display:flex;justify-content:center;gap:6px;margin:18px 0 14px}
.tour-dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .25s,background .25s}
.tour-dots i.on{width:20px;background:var(--c)}
.tour-b{display:flex;align-items:center;gap:10px}
.tour-b .btn{flex:1;margin:0}
.tour-b .linkb{--c:var(--muted)}
.lv-replay{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:2px 0 8px;color:var(--c);font-weight:600}
.lv-replay svg{width:16px;height:16px}
.lvfx{position:fixed;inset:0;z-index:400;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#fff;animation:lvIn .35s ease both;-webkit-tap-highlight-color:transparent}
.lvfx.out{animation:lvOut .32s ease both}
.lvfx-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--t) 55%, #05070B) 0%, color-mix(in srgb, var(--t) 18%, #05070B) 42%, #04060A 78%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lvfx-rays{position:absolute;left:50%;top:40%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--t) 40%, transparent) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle, #000 0, rgba(0,0,0,.6) 8%, transparent 26%);mask:radial-gradient(circle, #000 0, rgba(0,0,0,.6) 8%, transparent 26%);
  animation:lvRays .9s ease .15s both, lvSpin 30s linear infinite}
.lvfx-ring{position:absolute;left:50%;top:40%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:3px solid var(--t);opacity:0;animation:lvWave 1.2s cubic-bezier(.2,.6,.3,1) .45s both}
.lvfx-ring.r2{animation-delay:.7s;border-width:2px}
.lvfx-parts i{position:absolute;left:50%;top:40%;width:var(--z);height:var(--z);margin:calc(var(--z) / -2) 0 0 calc(var(--z) / -2);border-radius:50%;background:color-mix(in srgb, var(--t) 50%, #fff);box-shadow:0 0 10px var(--t);opacity:0;animation:lvPart 1.3s cubic-bezier(.15,.7,.3,1) var(--s) both}
.lvfx-c{position:absolute;left:0;right:0;top:40%;transform:translateY(-120px);text-align:center;padding:0 24px}
.lvfx-eb{font:700 15px var(--body);letter-spacing:.32em;text-transform:uppercase;color:color-mix(in srgb, var(--t) 45%, #fff);margin-bottom:6px;animation:lvRise .5s ease .25s both}
.lvfx-badge{display:grid;place-items:center;height:170px;filter:drop-shadow(0 0 26px color-mix(in srgb, var(--t) 80%, transparent));animation:lvPop .9s cubic-bezier(.3,1.45,.5,1) .3s both}
.lvfx-badge svg{width:156px;height:156px}
.lvfx-n{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;letter-spacing:.02em;margin-top:14px;text-transform:uppercase;animation:lvRise .5s ease .55s both}
.lvfx-n .roll{display:inline-block;height:1em;overflow:hidden;vertical-align:top}
.lvfx-n .roll>span{display:flex;flex-direction:column;animation:lvRoll .55s cubic-bezier(.5,1.6,.4,1) 1.05s both}
.lvfx-n .roll i{font-style:normal;height:1em;line-height:1;color:color-mix(in srgb, var(--t) 40%, #fff)}
.lvfx-name{font-size:18px;font-weight:600;margin-top:10px;color:rgba(255,255,255,.88);animation:lvRise .5s ease 1.25s both}
.lvfx-name b{color:color-mix(in srgb, var(--t) 45%, #fff)}
.lvfx-pts{font-size:14px;color:rgba(255,255,255,.6);margin-top:6px;animation:lvRise .5s ease 1.4s both}
.lvfx-hint{position:absolute;left:0;right:0;text-align:center;bottom:calc(env(safe-area-inset-bottom, 0px) + 44px);font-size:14px;color:rgba(255,255,255,.55);animation:lvFade .6s ease 2s both, lvBreath 2.4s ease-in-out 2.6s infinite}
@keyframes lvIn{from{opacity:0}to{opacity:1}}
@keyframes lvOut{to{opacity:0;transform:scale(1.04)}}
@keyframes lvRays{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes lvSpin{to{rotate:360deg}}
@keyframes lvWave{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(3.2)}}
@keyframes lvPart{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.3)}}
@keyframes lvPop{0%{opacity:0;transform:scale(.15) rotate(-220deg)}60%{opacity:1;transform:scale(1.14) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes lvRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lvRoll{from{transform:translateY(0)}to{transform:translateY(-1em)}}
@keyframes lvFade{from{opacity:0}to{opacity:1}}
@keyframes lvBreath{0%,100%{opacity:.55}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.lvfx,.lvfx *{animation:none!important}.lvfx-n .roll>span{transform:translateY(-1em)}.lvfx-rays{opacity:.6}.stw-i svg,.tmr-i svg{animation:none!important}}
.icon-btn.sync{position:relative}
.today-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px 0 10px;border-radius:14px;background:color-mix(in srgb, var(--glow) 18%, var(--surface));color:var(--fg);font-weight:600;font-size:14px;box-shadow:var(--elev);transition:transform .15s}
.today-btn:active{transform:scale(.94)}
.today-btn svg{width:18px;height:18px;color:var(--glow)}
.sync i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 2px var(--surface)}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="saving"] i{background:var(--warn);animation:blink 1s infinite}
.sync[data-s="local"] i,.sync[data-s="slow"] i,.sync[data-s="error"] i{background:var(--warn)}
@keyframes blink{50%{opacity:.25}}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--elev)}
.icon-btn svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- view + entrance motion ---------- */
.view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.view.in-r{animation:inR .34s cubic-bezier(.2,.8,.2,1) both}
.view.in-l{animation:inL .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{transform:translateX(22px)}to{transform:none}}
@keyframes inL{from{transform:translateX(-22px)}to{transform:none}}
.view.enter > *{animation:rise .46s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--d,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--elev)}
.sec-t{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;margin:0 0 10px;text-wrap:balance}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

p{margin:0}

/* ---------- day strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;transition:background .2s}
.strip .dl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.strip .dn{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.strip .dot{width:8px;height:8px;border-radius:50%;border:1.6px solid var(--c);opacity:.9}
.strip .dot.full{background:var(--c)}
.strip .dot.half{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.strip button[aria-current="date"]{background:var(--surface)}
.strip button.is-today .dn{color:var(--c)}

/* ---------- workout banner ---------- */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 14px;flex-wrap:wrap;
  background:linear-gradient(150deg, color-mix(in srgb, var(--c) 30%, var(--surface)) 0%, color-mix(in srgb, var(--c) 12%, var(--surface)) 70%);
  display:flex;gap:14px;align-items:center;box-shadow:var(--elev),inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent)}
.bnote{flex-basis:100%;font-size:13.5px;line-height:1.45;color:color-mix(in srgb, var(--fg) 78%, transparent);padding-top:11px;border-top:1px solid color-mix(in srgb, var(--c) 25%, transparent);position:relative;z-index:1}
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbar .linkb{margin-left:auto}

.tchip .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
.tchip .tick svg{width:11px;height:11px;stroke:var(--on-c);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tchip .tick path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.tchip.on{color:var(--fg);background:color-mix(in srgb, var(--c) 16%, var(--surface))}
.tchip.on .tick{background:var(--c);border-color:var(--c)} .tchip.on .tick path{stroke-dashoffset:0}
.exp-note{padding:0 4px;margin-top:-4px}
.banner::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%);pointer-events:none}
.banner .bt{flex:1;min-width:0}
.banner .lbl{color:var(--c)}
.banner h2{margin:4px 0 2px;font-family:var(--display);font-weight:700;font-size:46px;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.banner .focus{font-weight:600}
.banner .meta{font-size:13px;color:var(--muted);margin-top:6px}
.ring{position:relative;width:86px;height:86px;flex-shrink:0;z-index:1}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring .trk{stroke:color-mix(in srgb, var(--c) 22%, transparent)}
.ring .val{stroke:var(--c);transition:stroke-dashoffset .8s cubic-bezier(.3,.8,.2,1)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rt b{font-family:var(--display);font-size:24px;font-weight:700;display:block}
.ring .rt small{font-size:11px;color:var(--muted)}

.phase{display:flex;gap:12px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;
  background:color-mix(in srgb, var(--c, var(--pull)) 16%, transparent);color:var(--c, var(--pull));white-space:nowrap}

/* ---------- exercise cards ---------- */
.ex{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--elev);transition:box-shadow .4s,opacity .3s}

.upnext{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c);margin-bottom:2px}
.upnext::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.ex.fold{padding:10px 12px;gap:0;background:color-mix(in srgb, var(--surface) 70%, transparent);cursor:pointer;transition:transform .15s,background .2s}
.ex.fold:active{transform:scale(.98);background:var(--surface)}
.ex.fold .editb{pointer-events:none}
.ex-h.tapfold{cursor:pointer;border-radius:12px;margin:-4px;padding:4px;transition:background .2s}

/* exercise figures */
.thumb{--figbg:color-mix(in srgb, var(--c) 9%, var(--surface-2));position:relative;width:86px;height:72px;flex-shrink:0;border-radius:14px;background:var(--figbg);display:block;transition:transform .2s}

.fig .eqbar{stroke:var(--eqf)} .fig .eqbarc{fill:var(--eqf)}
.fig .stk{fill:var(--fig2)} .fig .stkt{fill:var(--c)}

.fig .dbw{fill:var(--c)} .fig .dbr{fill:color-mix(in srgb, var(--c) 60%, var(--figbg))} .fig .dbh{stroke:var(--fig2)}
.fig .padc{fill:var(--c)} .fig .padr{fill:var(--eqpad)}

.ex{position:relative;overflow:hidden}

  background:linear-gradient(105deg,transparent 30%,color-mix(in srgb, var(--c) 30%, transparent) 50%,transparent 70%);
  transform:translateX(-100%);animation:shine .9s ease-out forwards}
.ex.shine::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,color-mix(in srgb, var(--c) 30%, transparent) 50%,transparent 70%);

.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.btn,.chk,.strip button,.tabs button,.icon-btn,.mv,.seg button,.qual button,.meal,.chip,.nights button,.row{transition-property:transform,background,color,border-color,box-shadow,opacity;transition-duration:.2s}
.btn:active,.chk:active,.strip button:active,.icon-btn:active,.mv:active,.seg button:active,.qual button:active,.meal:active,.chip:active,.nights button:active{transform:scale(.95)}

.mode-r{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* volume bars */
.vb{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}

.vb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb .nm.pr{font-weight:600}
.vb .ct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* food */
.macro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.macro div{background:color-mix(in srgb, var(--c) 13%, var(--surface));border-radius:14px;padding:11px 10px;min-width:0}

.macro span{font-size:11.5px;color:var(--muted)}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);text-align:left;width:100%;transition:background .25s}
.meal + .meal{margin-top:8px}
.meal .mt{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);width:44px;flex-shrink:0;padding-top:1px}
.meal .mx{flex:1;min-width:0}
.meal .mx b{font-weight:600;display:block}
.meal .mx span{font-size:13px;color:var(--muted)}
.meal .mk{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.meal .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:background .25s,border-color .25s}
.meal .tick svg{width:15px;height:15px;stroke:var(--on-c);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.meal .tick path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.meal.on{background:color-mix(in srgb, var(--c) 16%, var(--surface-2))}
.meal.on .tick{background:var(--c);border-color:var(--c)}
.meal.on .tick path{stroke-dashoffset:0}
.meter{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .6s cubic-bezier(.3,.8,.2,1)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.bul li::marker{color:var(--c, var(--muted))}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:0 6px 6px 0}
table.t td{padding:9px 6px 9px 0;border-top:1px solid var(--line);vertical-align:top}
table.t tr.hl td{color:var(--c);font-weight:600}

/* sleep */
.nights{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.nights::-webkit-scrollbar{display:none}
.nights button{flex-shrink:0;padding:8px 12px;border-radius:12px;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}

.big-h{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em}

button.row{color:inherit}

.fl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

   too little sleep for athletes. The top band is your own target, 8 h 15, the upper part of the 7–9 h range. */
const SLEEP_TIERS = [
  { k: "great", min: SLEEP_T, c: "var(--core)", w: "Great night", r: `${SLEEP_L} or more` },
  { k: "ok", min: 7, c: "var(--good)", w: "Enough sleep", r: `7 h to ${SLEEP_L}` },
  { k: "short", min: 6, c: "var(--orng)", w: "A bit short", r: "6 to 7 h" },
  { k: "low", min: 0, c: "var(--bad)", w: "Not enough sleep", r: "under 6 h" }];
const sleepTier = h => h == null ? null : h >= 11 ? { k: "long", c: "var(--orng)", w: "Very long night" } : SLEEP_TIERS.find(t => h >= t.min - 1e-9);
const sleepMsg = (h0, shown) => {
  if (h0 == null) return "Not logged yet. Change a time, or tap Save if these are right.";
  const t = sleepTier(shown), gap = Math.round((SLEEP_T - shown) * 60), w = `<b class="sq-w">${t.w}.</b> `;
  if (t.k === "great") return w + "This is where muscle gets built.";
  if (t.k === "ok") return w + `${gap >= 60 ? Math.floor(gap / 60) + " h " + pad(gap % 60) : gap + " min"} short of ${SLEEP_L}. Fine for training today${gap > 30 ? "; try 30 min earlier tonight" : ""}.`;
  if (t.k === "short") return w + "Train as planned, but get to bed 30–45 min earlier tonight.";
  if (t.k === "low") return w + "Keep today's sets at the easy end of the RIR range, and get to bed early tonight.";
  return w + "Fine to catch up once. If it happens often, sleep more during the week instead.";
};
function bedFor(w) { const [h, m] = w.split(":").map(Number); let t = h * 60 + m - Math.round(SLEEP_T * 60) - 15; t = ((t % 1440) + 1440) % 1440; return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; }
function growBars(root) {
  const bars = [...root.querySelectorAll(".chart rect.bar[data-b]")]; if (!bars.length || REDUCED) return;
  const T0 = performance.now(), D = 700, ease = x => 1 - Math.pow(1 - x, 3);
  const fin = bars.map(r => ({ r, y: +r.dataset.y, b: +r.dataset.b }));
  fin.forEach(f => { f.r.setAttribute("y", f.b); f.r.setAttribute("height", 0); });
  const step = now => {
    let busy = false;
    fin.forEach((f, i) => { const q = Math.min(1, Math.max(0, (now - T0 - i * 30) / D)); if (q < 1) busy = true; const y = f.b - (f.b - f.y) * ease(q); f.r.setAttribute("y", y.toFixed(1)); f.r.setAttribute("height", (f.b - y).toFixed(1)); });
    if (busy && fin[0].r.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function barChart(nights) {
  const VW = 340, VH = 180, L = 30, R = 8, T = 12, B = 26, max = 10;
  const bw = (VW - L - R) / nights.length, Y = v => T + (VH - T - B) * (1 - v / max);
  let g = "";
  [0, 2, 4, 6, 8, 10].forEach(v => g += `<line class="gl" x1="${L}" x2="${VW - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v}h</text>`);
  const pts = [];
  nights.forEach((n, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64, cx = x + w / 2;
    if (n.h != null) {
      const y = Y(Math.min(max, n.h));
      g += `<rect class="bar ${n.h < SLEEP_T ? "lo" : ""}" data-i="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(VH - B - y).toFixed(1)}" rx="3" data-y="${y.toFixed(1)}" data-b="${VH - B}"/>`;
    }
    pts.push({ date: n.date, y: n.h, px: cx, py: n.h != null ? Y(Math.min(max, n.h)) : Y(0), bar: true, q: n.q, bed: n.bed, wake: n.wake });
    if (i % 2 === 1 || i === nights.length - 1) if (i === nights.length - 1 || i % 4 === 1) g += `<text class="ax" x="${cx}" y="${VH - 8}" text-anchor="middle">${parse(n.date).getDate()}</text>`;
  });
  g += `<line class="tl" x1="${L}" x2="${VW - R}" y1="${Y(SLEEP_T)}" y2="${Y(SLEEP_T)}"/>`;
  CH.sl = { pts, VW, VH, T, B };
  return `<div class="chart" data-chart="sl" style="--c:var(--core)"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Hours slept, last 14 nights">${g}</svg><div class="tip"></div></div>`;
}

/* ================= chart tooltips ================= */
function chartAt(el, clientX) {
  const id = el.dataset.chart, c = CH[id]; if (!c) return;
  const r = el.querySelector("svg").getBoundingClientRect(), vx = (clientX - r.left) / r.width * c.VW;
  let best = null, bd = 1e9; for (const p of c.pts) { if (p.y == null) continue; const dd = Math.abs(p.px - vx); if (dd < bd) { bd = dd; best = p; } }
  if (!best) return;
  el.classList.add("on");
  const tip = el.querySelector(".tip"), sc = r.width / c.VW;
  if (best.bar) {
    el.querySelectorAll(".bar").forEach(b => b.classList.toggle("pick", +b.dataset.i === c.pts.indexOf(best)));
    tip.innerHTML = `${fH(best.y)}<small>${best.bed ? best.bed + " → " + best.wake : ""}</small><small>Night to ${fShort(best.date)}</small>`;
  } else {
    const xh = el.querySelector(".xh"), fd = el.querySelector(".fd");
    xh.setAttribute("x1", best.px); xh.setAttribute("x2", best.px); fd.setAttribute("cx", best.px); fd.setAttribute("cy", best.py);
    const s = best.s;
    if (id === "bw") tip.innerHTML = `${kg(best.y)} kg<small>${fShort(best.date)}</small>`;
    if (id === "ex") {
      const exo = allExercises().find(e => e.id === S.exSel);
      tip.innerHTML = exo && exo.bw ? `${best.y} reps<small>${fShort(best.date)}</small>` :
        `${S.metric === "e" ? kg(best.y) + " kg est. max" : kg(best.y) + " kg"}<small>${s ? `best ${kg(s.top.w)} × ${s.top.r} · ` : ""}${fShort(best.date)}</small>`;
    }
  }
  const half = Math.min(r.width / 2, (tip.offsetWidth || 120) / 2 + 2), tx = Math.max(half, Math.min(r.width - half, best.px * sc));
  tip.style.left = tx + "px"; tip.style.top = Math.max(-8, best.py * sc - (tip.offsetHeight || 44) - 8) + "px";
}
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".chart");
  document.querySelectorAll(".chart.on").forEach(c => { if (c !== el) c.classList.remove("on"); });
  if (el) chartAt(el, e.clientX);
});
document.addEventListener("pointermove", e => { const el = e.target.closest(".chart"); if (el && (e.pointerType === "mouse" || e.buttons)) chartAt(el, e.clientX); });
document.addEventListener("pointerleave", e => { if (e.target.classList && e.target.classList.contains("chart") && e.pointerType === "mouse") e.target.classList.remove("on"); }, true);

/* ================= rest timer ================= */
let T = null, tIv = null, actx = null;
// hx = { id, d, next }: which lift's past sessions to show while resting (next = it is the upcoming exercise)
function startTimer(sec, label, color, hx) {
  const st = SET(); if (!sec || !st.rest.auto) return;
  sec = Math.max(15, sec + (st.rest.adj || 0));
  T = { end: Date.now() + sec * 1000, total: sec, label, lastS: null, hx: hx || null }; timerHist();
  const el = $("#timer"); el.style.setProperty("--c", color); el.classList.remove("over"); el.classList.add("show");
  $("#tlab").textContent = "Rest · " + label;
  clearInterval(tIv); tIv = setInterval(tick, 200); tick();
}
const EXBY = {}; for (const k in PROGRAM) for (const ex of PROGRAM[k].ex) { EXBY[ex.id] = ex; const a = altOf(ex); if (a && !EXBY[a.id]) EXBY[a.id] = a; }
function setsLine(sets, ex) {
  const W = w => ex.bw ? (w ? "+" + kg(w) + " kg" : "body weight") : kg(w) + " kg";
  if (sets.every(x => x.w === sets[0].w)) return `${W(sets[0].w)} × ${sets.map(x => x.r).join(", ")}`;
  return sets.map(x => `${ex.bw ? (x.w ? "+" + kg(x.w) : "BW") : kg(x.w)}×${x.r}`).join(", ");
}
function timerHist() {
  const el = $("#thist"); if (!el) return;
  const hx = T && T.hx, ex = hx && EXBY[hx.id];
  const hs = ex && !ex.chk && SET().rest.hist ? exHistory(hx.id).filter(h => h.date < hx.d).slice(-3).reverse() : [];
  if (!hs.length) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = `<div class="th-t">${hx.next ? "Next · " + escH(ex.n.split(" (")[0]) : "Your last sessions"}</div>` + hs.map(h => `<div class="th-r"><span>${fDM(h.date)}</span><b class="num">${setsLine(h.sets, ex)}</b></div>`).join("");
}
// the next exercise that still has open sets (after the current one, else the first open one)
function nextOpen(d, k) {
  const doc = dayDoc(d), p = plan(d).filter(x => !x.skip), i = p.findIndex(x => x.k === k);
  const open = x => { const n = setsFor(d, x.ex, x.k), a = (doc && doc.ex && doc.ex[x.k]) || []; return a.slice(0, n).filter(q => q && q.ok).length < n; };
  return p.slice(i + 1).find(open) || p.find(x => x.k !== k && open(x)) || null;
}
function tick() {
  if (!T) return;
  const left = Math.max(0, T.end - Date.now()), s = Math.ceil(left / 1000);
  if (s !== T.lastS) { if (s >= 1 && s <= 3 && T.lastS != null) SND.count(); T.lastS = s; }
  $("#ttime").textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
  $("#tval").style.strokeDashoffset = (113.1 * (1 - left / (T.total * 1000))).toFixed(1);
  if (left <= 0) {
    clearInterval(tIv); const el = $("#timer"); el.classList.add("over"); $("#ttime").textContent = "Go";
    const late = Date.now() - T.end > 3000;
    $("#tlab").textContent = late ? "Rest finished while you were away" : "Rest over · next set"; if (!late) SND.timer();
    T = null; setTimeout(() => { if (!T) el.classList.remove("show", "over"); }, 5000);
  }
}
function beep() {
  try {
    if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5); o.start(); o.stop(actx.currentTime + 0.55);
  } catch (e) {}
}

/* ================= confetti + toast ================= */
function confetti() {
  if (REDUCED) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), cols = ["--push", "--pull", "--legs", "--core", "--warn"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.32, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = t => {
    const el = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += 0.38; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 2200); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (el < 2200) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(step);
}

  } else if (el.dataset.f === "bed" || el.dataset.f === "wake") sleepTime(el);
  else if (el.id === "calcwake" && el.value) $("#calcout").textContent = bedFor(el.value);
});
// Save a bedtime / wake-up change and refresh the numbers around it, without rebuilding the page.
// (Rebuilding removed the time field while the iPhone picker was still open, which closed it after every spin.)
function sleepTime(el) {
  const bed = $("#bed"), wake = $("#wake"); if (!bed || !wake) return;
  const v = { bed: bed.value, wake: wake.value }; if (!v.bed || !v.wake) return; // half-cleared field: wait for a real time
  const doc = ensureDay(S.night), old = doc.sleep || {};
  if (old.bed === v.bed && old.wake === v.wake) return;
  doc.sleep = { ...old, ...v, src: "me", ...(old.src === "garmin" || old.fw ? { fw: 1 } : {}) }; touch("d" + S.night); patchSleep();
}
function patchSleep() {
  if (S.tab !== "sleep") return;
  const tpl = document.createElement("template"); for (const k in CH) delete CH[k]; tpl.innerHTML = vSleep();
  const nScroll = ($("#sl-nights") || {}).scrollLeft || 0;
  ["sl-nights", "sl-big", "sl-src", "sl-msg", "sl-save", "sl-sum", "sl-chart"].forEach(id => { const a = document.getElementById(id), b = tpl.content.getElementById(id); if (a && b) a.replaceWith(b); });
  { const a = $("#sl-card"), b = tpl.content.getElementById("sl-card"); if (a && b) { a.className = b.className; a.style.cssText = b.style.cssText; } }
  { const a = $("#sl-times"), b = tpl.content.getElementById("sl-times"); if (a && b && (a.dataset.m === "ro" || b.dataset.m === "ro")) a.replaceWith(b); }
  const n = $("#sl-nights"); if (n) n.scrollLeft = nScroll;
}
view.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "exsel") { S.exSel = el.value; softRenderAnim(); }
  else if (el.dataset.f === "bed" || el.dataset.f === "wake") {
    sleepTime(el);
  } else if (el.id === "calcwake" && el.value) {
    $("#calcout").textContent = bedFor(el.value);
    S.docs.settings = { ...(S.docs.settings || {}), wake: el.value }; touch("settings");
  }
});
$("#sheet").addEventListener("input", e => {
  if (e.target.id === "vol") { const st = JSON.parse(JSON.stringify(S.docs.settings || {})); st.snd = { ...(st.snd || {}), vol: +e.target.value }; S.docs.settings = st; touch("settings"); }
  if (e.target.id === "custom") { const st = JSON.parse(JSON.stringify(S.docs.settings || {})); st.custom = e.target.value; st.palette = "custom"; S.docs.settings = st; applySettings(); }
});
$("#sheet").addEventListener("change", e => {
  if (e.target.id === "vol") { SND.unlock(); SND.timer(true); return; }
  if (e.target.id === "custom") { touch("settings"); openSheet(); render(false); return; }
  if (e.target.id === "start" && e.target.value) {
    S.docs.settings = { ...(S.docs.settings || {}), start: e.target.value }; touch("settings");
    toast(`Week 1 now starts ${fShort(mondayOf(e.target.value))}`); render(false);
  }
});

setInterval(() => { if (S.tab === "today" && !document.hidden) { const d0 = dayDoc(S.sel); if (d0 && d0.start && !d0.done) { const bm = $("#bmeta"); if (bm) bm.textContent = bannerMeta(S.sel); } } }, 20000);

view.addEventListener("keydown", e => { if (e.target.dataset && e.target.dataset.note && e.key === "Enter") { e.preventDefault(); S.noteEdit = null; flipList(); } });

/* swipe left/right on Today to change day */
let sw = null;
view.addEventListener("touchstart", e => {
  if (S.tab !== "today" || S.edit || !SET().ui.swipe || e.touches.length !== 1 || e.target.closest("input,select,.chart,.nights")) { sw = null; return; }
  sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
view.addEventListener("touchend", e => {
  if (!sw) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y; const quick = Date.now() - sw.t < 600; sw = null;
  if (!quick || Math.abs(dx) < 70 || Math.abs(dy) > 45) return;
  S.sel = addD(S.sel, dx < 0 ? 1 : -1);
  render(false); view.classList.add(dx < 0 ? "swipe-l" : "swipe-r");
}, { passive: true });

/* remember where you were, so a restart by iOS doesn't throw you back to the top */
const UIK = "aub.ui";
function saveUI() {
  try { localStorage.setItem(UIK, JSON.stringify({ tab: S.tab, sel: S.sel, y: Math.round(scrollY), t: Date.now(), day: today(),
    timer: T ? { end: T.end, total: T.total, label: T.label, hx: T.hx, c: $("#timer").style.getPropertyValue("--c") } : null })); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.hidden) saveUI(); });
addEventListener("pagehide", saveUI);
let UI0 = null; try { UI0 = JSON.parse(localStorage.getItem(UIK) || "null"); } catch (e) {}
if (UI0 && Date.now() - UI0.t > 45 * 60000) UI0 = null;

/* ================= boot ================= */
const h0 = location.hash.slice(1);
buildTabs(); // the user's tab order; the first visible tab (Home by default) is where the app opens
S.tab = TABS.includes(h0) ? h0 : UI0 && TABS.includes(UI0.tab) ? UI0.tab : TABS[0];
if (UI0 && UI0.day === today() && UI0.sel) S.sel = UI0.sel;
applySettings();
MQ.addEventListener && MQ.addEventListener("change", () => { applyMotion(); render(false); });
let BOOT_HTML = "";
render(true); BOOTED = true;
{ // loading screen: stays at least ~0.95 s so the entrance can finish, then the two halves slide apart
  const bt = document.getElementById("boot");
  if (bt) { BOOT_HTML = bt.outerHTML; setTimeout(() => bootOut(bt), Math.max(0, (REDUCED ? 250 : 950) - performance.now())); } }
// coming back to the app after a while (it was in the background, not closed) plays the loading animation again,
// except during a workout, so switching to music between sets never gets in the way
function bootOut(bt) {
  requestAnimationFrame(() => {
    const R = document.documentElement; R.classList.add("booting"); bt.classList.add("gone"); R.classList.remove("bootin");
    // remove it once fully transparent, then repaint the page under it once (iOS can keep a stale frame of a removed layer)
    setTimeout(() => { bt.remove(); R.classList.remove("booting"); const v = document.getElementById("view"); if (v) { v.style.outline = "1px solid transparent"; requestAnimationFrame(() => { v.style.outline = ""; }); } }, 560);
  });
}
let HIDDEN_AT = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { HIDDEN_AT = Date.now(); return; }
  const away = HIDDEN_AT ? Date.now() - HIDDEN_AT : 0; HIDDEN_AT = 0;
  const st = stwState(dayDoc(today()));
  if (!BOOT_HTML || away < 20000 || st === "run" || st === "pause" || document.getElementById("boot")) return;
  const tpl = document.createElement("template"); tpl.innerHTML = BOOT_HTML; const bt = tpl.content.firstElementChild; bt.classList.remove("gone");
  document.documentElement.classList.add("bootin", "booting"); document.body.appendChild(bt); setTimeout(() => bootOut(bt), REDUCED ? 250 : 950);
});
if (UI0 && UI0.y && (TABS.includes(h0) ? h0 === UI0.tab : true)) requestAnimationFrame(() => scrollTo(0, UI0.y));
if (UI0 && UI0.timer && UI0.timer.end > Date.now() + 1000) {
  const tm = UI0.timer; T = { end: tm.end, total: tm.total, label: tm.label, lastS: null, hx: tm.hx || null }; setTimeout(timerHist, 0);
  const el = $("#timer"); el.style.setProperty("--c", tm.c || "var(--pull)"); el.classList.add("show");
  $("#tlab").textContent = "Rest · " + tm.label; clearInterval(tIv); tIv = setInterval(tick, 200); tick();
}
connect();
// keep "today" fresh if the app stays open overnight
let lastDay = today();
function onResume() {
  try {
    if (today() !== lastDay) { if (S.sel === lastDay) S.sel = today(); if (S.night === lastDay) S.night = today(); lastDay = today(); S.open.clear(); render(false); }
    else if (S.tab === "today") { const bm = $("#bmeta"); if (bm) bm.textContent = bannerMeta(S.sel); }
    if (T) { clearInterval(tIv); tIv = setInterval(tick, 200); tick(); }
  } catch (e) { logErr("resume: " + ((e && e.stack) || e)); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) onResume(); });
addEventListener("pageshow", e => { if (e.persisted) onResume(); });
addEventListener("focus", onResume);
document.addEventListener("freeze", () => { if (saveT) saveNow(); saveUI(); });
})();
</script>

<div id="upd" class="upd" hidden role="status"><span>New version ready</span><button type="button" id="updgo">Reload</button><button type="button" id="updx" aria-label="Later">✕</button></div>
<style>.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:60;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:999px;background:var(--fg,#EEF1F6);color:var(--bg,#0C0F14);font:600 14px var(--body,system-ui);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);white-space:nowrap}

<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // a newer version was downloaded in the background: offer a one-tap reload (saves first)
  navigator.serviceWorker.addEventListener("message", e => {
    if (!e.data || e.data.type !== "update-ready") return;
    const u = document.getElementById("upd"); if (!u) return; u.hidden = false;
    document.getElementById("updgo").onclick = () => { try { dispatchEvent(new Event("pagehide")); } catch (x) {} setTimeout(() => location.reload(), 150); };
    document.getElementById("updx").onclick = () => { u.hidden = true; };
  });
}
</script>
